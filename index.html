<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조선왕조실록 사건 지도</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700;900&display=swap">

<style>
:root{
  /* 한지 · 먹 · 단청 */
  --hanji:#F7F1E3;
  --hanji-dark:#EFE5CF;
  --paper-card:#FDFAF3;
  --ink:#332C25;
  --ink-2:#6A6052;
  --ink-3:#9C8F79;
  --seal:#B02B22;
  --dancheong:#255A6E;
  --gold:#C1922F;
  --line:#DACCA7;
  --line-soft:#EDE3C8;

  /* 지도면 */
  --sea:#D8C9A0;
  --land:#FCF7EA;
  --land-edge:#8E7B58;
  --land-mute:#F3ECDA;
  --land-mute-edge:#B09D71;
  --grid:rgba(92,78,54,.15);

  --accent:var(--seal);
  --accent-soft:rgba(176,43,34,.09);
  --shadow:0 6px 20px rgba(60,44,20,.18);
  --shadow-sm:0 2px 8px rgba(60,44,20,.14);

  /* 분류 — 단청 오방색 계열 */
  --c-war:#B53127;   /* 전란 · 석간주 */
  --c-coup:#28607A;  /* 정변 · 군청 */
  --c-dipl:#37866F;  /* 외교 · 뇌록 */
  --c-inst:#C99A2E;  /* 제도 · 치자 */
  --c-soc:#74833F;   /* 사회 · 뇌록황 */
  --c-cult:#875290;  /* 문화 · 자주 */
  --c-econ:#8A5A2B;  /* 경제 · 번주토 */

  --focus:#1F4A5C;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--hanji); color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  font-weight:400; -webkit-font-smoothing:antialiased;
}
/* 한지 결 */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:9999;
  background-image:radial-gradient(rgba(60,45,20,.028) 1px, transparent 1px);
  background-size:3px 3px; mix-blend-mode:multiply; opacity:.45;
}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh;min-height:560px}

.topbar{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:12px 20px;background:var(--paper-card);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 6px rgba(60,44,20,.08);
  position:relative;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.seal-mark{
  width:24px;height:24px;border-radius:3px;background:var(--seal);color:#F8F2E3;
  display:grid;place-items:center;flex:none;
  font-family:"Noto Serif KR",serif;font-weight:700;font-size:13px;line-height:1;
  box-shadow:0 1px 3px rgba(120,40,30,.35);
}
.brand h1{
  font-family:"Noto Serif KR",serif;font-weight:900;font-size:20px;margin:0;
  letter-spacing:.02em;white-space:nowrap;color:var(--ink);
}
.brand .era{
  font-family:"Noto Serif KR",serif;font-size:12px;letter-spacing:.12em;
  color:var(--ink-3);white-space:nowrap;
}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border:1px solid var(--line);border-radius:3px;
  font-size:12px;color:var(--ink-2);line-height:1;background:var(--paper-card);
  transition:border-color .15s,color .15s,background .15s,opacity .15s;
}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--hanji-dark);color:var(--ink);border-color:var(--line)}
.chip[aria-pressed="false"]{opacity:.4}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--cat,var(--ink-3))}

/* ---------- body grid ---------- */
.main{display:grid;grid-template-columns:312px 1fr;min-height:0;position:relative}

/* ---------- list rail ---------- */
.rail{
  border-right:1px solid var(--line);background:var(--paper-card);
  display:flex;flex-direction:column;min-height:0;
}
.rail-head{
  padding:11px 16px;background:var(--hanji-dark);
  border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
}
.rail-head h2{
  margin:0;font-family:"Noto Serif KR",serif;font-size:14px;font-weight:700;
  letter-spacing:.06em;color:var(--ink);
}
.rail-head .count{font-size:11px;color:var(--ink-2)}
.list{overflow-y:auto;padding:4px 0 24px;flex:1;scrollbar-width:thin}
.reign{
  position:sticky;top:0;z-index:2;background:var(--hanji-dark);
  padding:7px 16px;font-family:"Noto Serif KR",serif;font-size:12px;font-weight:700;
  letter-spacing:.1em;color:var(--ink-2);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.item{
  display:grid;grid-template-columns:14px 1fr;gap:11px;width:100%;text-align:left;
  padding:10px 16px;border-left:3px solid transparent;position:relative;
  transition:background .13s,border-color .13s;
}
.item:hover{background:rgba(176,43,34,.06);border-left-color:var(--seal)}
.item[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--seal)}
.item .rule{
  width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--cat);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--cat) 15%,transparent);
}
.item .yr{font-family:"Noto Serif KR",serif;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item .nm{font-size:13.5px;line-height:1.4;margin-top:1px;font-weight:500;color:var(--ink)}
.item[aria-current="true"] .nm{color:var(--seal)}
.item .pl{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.item .seq{
  display:inline-block;margin-left:6px;font-size:9.5px;letter-spacing:.08em;
  color:var(--seal);border:1px solid currentColor;border-radius:2px;padding:1px 4px;
  vertical-align:1px;
}

/* ---------- map ---------- */
.stage{position:relative;min-width:0;background:var(--sea);overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
.land{fill:var(--land);stroke:var(--land-edge)}
.land-mute{opacity:1}
.land-mute{fill:var(--land-mute);stroke:var(--land-mute-edge)}
.graticule{stroke:var(--grid);fill:none}
.border{fill:none;stroke:var(--land-mute-edge);stroke-linecap:round;opacity:.9}
.farlabel{
  fill:var(--ink-3);font-family:"Noto Serif KR",serif;font-weight:700;
  paint-order:stroke;stroke:var(--land-mute);stroke-width:3.5px;stroke-linejoin:round;
}
.sealabel{
  fill:var(--ink-3);font-family:"Noto Serif KR",serif;font-weight:400;opacity:.75;
}
.placelabel{
  fill:var(--ink-2);font-family:"Noto Serif KR",serif;font-size:11px;font-weight:600;
  paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;
}
.seqpath{
  fill:none;stroke:var(--seal);stroke-linecap:round;stroke-linejoin:round;
  opacity:.9;animation:dash-flow 22s linear infinite;
}
@keyframes dash-flow{to{stroke-dashoffset:-1000}}

/* ---------- markers: 붓끝 낙관 ---------- */
.markers{position:absolute;inset:0 0 106px 0;pointer-events:none}
.mk{
  position:absolute;width:38px;height:42px;transform:translate(-50%,-100%);
  pointer-events:auto;display:block;transition:opacity .2s;z-index:4;
}
.markers.seq .mk:not(.step){opacity:.28}
.markers.seq .mk:not(.step):hover{opacity:.75}
.mk .pin{
  position:absolute;left:4px;top:6px;width:30px;height:30px;
  border-radius:50% 50% 50% 4px;background:var(--cat);
  border:2px solid rgba(248,242,227,.9);
  box-shadow:0 2px 5px rgba(60,44,20,.30);
  transform:rotate(-45deg);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s;
}
.mk .pin::after{
  content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;
  border-radius:50%;background:rgba(248,242,227,.92);transform:translate(-50%,-50%);
}
.mk:hover .pin{transform:rotate(-45deg) scale(1.14)}
.mk[data-sel="1"] .pin{
  transform:rotate(-45deg) scale(1.2);
  box-shadow:0 3px 6px rgba(60,44,20,.32),0 0 0 4px rgba(176,43,34,.20);
}
.mk .tip{
  position:absolute;left:50%;bottom:calc(100% - 2px);transform:translateX(-50%);
  background:var(--paper-card);color:var(--ink);border:1px solid var(--line);
  padding:4px 9px;border-radius:3px;font-size:11.5px;white-space:nowrap;
  box-shadow:var(--shadow-sm);opacity:0;pointer-events:none;transition:opacity .13s;
}
.mk:hover .tip,.mk:focus-visible .tip{opacity:1}
.mk.dim{opacity:.2}
.mk.step{transform:translate(-50%,-50%);width:26px;height:26px;z-index:7}
.mk.step .num{
  position:absolute;inset:0;border-radius:50%;
  background:var(--paper-card);color:var(--ink);
  display:grid;place-items:center;font-size:12px;font-weight:700;
  font-family:"Noto Serif KR",serif;
  border:2px solid var(--ink);box-shadow:0 2px 5px rgba(60,44,20,.28);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .18s,border-color .18s;
}
.mk.step[data-past="1"] .num{background:var(--ink-2);border-color:var(--ink-2);color:var(--hanji)}
.mk.step[data-cur="1"] .num{
  background:var(--seal);border-color:var(--seal);color:#F8F2E3;
  transform:scale(1.28);box-shadow:0 2px 6px rgba(60,44,20,.3),0 0 0 4px rgba(176,43,34,.18);
}
.mk.step .tip{bottom:calc(100% + 6px)}
.mk.drop{animation:drop .34s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes drop{from{opacity:0;transform:translate(-50%,-100%) translateY(-14px)}to{opacity:1}}
.mk.step.drop{animation-name:dropc}
@keyframes dropc{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1}}

/* ---------- floating controls ---------- */
.zoomctl{
  position:absolute;right:16px;bottom:122px;display:flex;flex-direction:column;
  background:var(--paper-card);border:1px solid var(--line);border-radius:4px;
  box-shadow:var(--shadow);overflow:hidden;z-index:12;
}
.zoomctl button{width:34px;height:34px;display:grid;place-items:center;color:var(--ink-2)}
.zoomctl button:hover{background:var(--hanji-dark);color:var(--ink)}
.zoomctl button+button{border-top:1px solid var(--line)}
.detail{
  position:absolute;top:0;right:0;bottom:0;width:396px;max-width:100%;
  background:var(--paper-card);border-left:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;z-index:20;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.detail.open{transform:none}
.d-top{padding:20px 22px 15px;background:var(--hanji-dark);border-bottom:1px solid var(--line);position:relative}
.d-close{position:absolute;top:14px;right:14px;width:28px;height:28px;display:grid;place-items:center;
  border-radius:3px;color:var(--ink-2)}
.d-close:hover{background:rgba(176,43,34,.09);color:var(--seal)}
.d-cat{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.1em;
  color:var(--cat);margin-bottom:8px;font-weight:700;
}
.d-cat i{width:8px;height:8px;border-radius:50%;background:var(--cat)}
.d-title{
  font-family:"Noto Serif KR",serif;font-weight:900;font-size:24px;line-height:1.3;
  margin:0 34px 0 0;text-wrap:balance;letter-spacing:.01em;
}
.d-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px;font-size:12.5px;color:var(--ink-2)}
.d-meta b{font-weight:700;color:var(--ink-3);letter-spacing:.08em;font-size:10.5px;
  display:block;margin-bottom:2px;font-family:"Noto Serif KR",serif}
.d-body{overflow-y:auto;padding:18px 22px 28px;flex:1;scrollbar-width:thin}
.d-sum{font-size:14px;line-height:1.9;margin:0 0 18px;max-width:62ch;color:var(--ink)}
.d-field{border-top:1px solid var(--line-soft);padding-top:13px;margin-top:14px}
.d-field h4{margin:0 0 5px;font-family:"Noto Serif KR",serif;font-size:11.5px;
  letter-spacing:.1em;color:var(--ink-3);font-weight:700}
.d-field p{margin:0;font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.d-field a{color:var(--seal);text-decoration:none;border-bottom:1px solid currentColor}
.d-field a:hover{opacity:.75}

.seqbox{margin-top:20px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seq-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 14px;background:var(--hanji-dark);border-bottom:1px solid var(--line);
}
.seq-head h4{margin:0;font-family:"Noto Serif KR",serif;font-size:12.5px;
  letter-spacing:.06em;color:var(--ink);font-weight:700}
.seq-ctl{display:flex;gap:5px;align-items:center}
.seq-ctl button{
  width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2);
  border:1px solid var(--line);background:var(--paper-card);
}
.seq-ctl button:hover:not(:disabled){background:var(--seal);border-color:var(--seal);color:#F8F2E3}
.seq-ctl button:disabled{opacity:.32;cursor:default}
.seq-ctl .play{
  width:auto;padding:0 14px;background:var(--seal);border-color:var(--seal);color:#F8F2E3;
  font-size:12px;font-weight:500;border-radius:999px;height:28px;
  display:inline-flex;align-items:center;
}
.seq-ctl .play:hover{filter:brightness(1.1)}
.steps{list-style:none;margin:0;padding:0;background:var(--paper-card)}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:11px;padding:12px 14px;
  border-top:1px solid var(--line-soft);transition:background .15s;cursor:pointer}
.steps li:first-child{border-top:0}
.steps li[aria-current="true"]{background:var(--accent-soft)}
.steps .n{
  width:23px;height:23px;border-radius:50%;background:var(--paper-card);
  border:2px solid var(--ink-3);color:var(--ink-2);
  display:grid;place-items:center;font-size:11.5px;font-family:"Noto Serif KR",serif;
  font-weight:700;margin-top:1px;
}
.steps li[aria-current="true"] .n{background:var(--seal);border-color:var(--seal);color:#F8F2E3}
.steps h5{margin:0;font-family:"Noto Serif KR",serif;font-size:13.5px;font-weight:700}
.steps .sd{font-size:11px;color:var(--ink-3);margin-top:2px}
.steps p{margin:5px 0 0;font-size:12.5px;line-height:1.7;color:var(--ink-2)}

/* ---------- timeline ---------- */
.timeline{
  position:absolute;left:0;right:0;bottom:0;height:74px;z-index:14;
  background:linear-gradient(180deg,var(--hanji-dark),var(--hanji));
  border-top:2px solid var(--ink);
  box-shadow:0 -6px 20px rgba(60,44,20,.14);
  padding:0 20px;
}
.tl-inner{position:relative;height:100%}
.tl-axis{
  position:absolute;left:0;right:0;top:43px;height:3px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 11px);
  opacity:.5;
}
.tl-tick{position:absolute;top:48px;width:1px;height:6px;background:var(--ink-3)}
.tl-year{position:absolute;top:56px;transform:translateX(-50%);font-size:10.5px;
  color:var(--ink-2);font-variant-numeric:tabular-nums}
.tl-ev{
  position:absolute;top:44px;transform:translate(-50%,-50%);
  width:14px;height:14px;border-radius:50%;background:var(--paper-card);
  border:2px solid var(--cat);transition:transform .18s,background .18s;
}
.tl-ev:hover{transform:translate(-50%,-50%) scale(1.35);background:var(--cat)}
.tl-ev[data-sel="1"]{
  background:var(--cat);transform:translate(-50%,-50%) scale(1.35);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--cat) 22%,transparent);
}
.tl-title{position:absolute;left:0;top:5px;font-family:"Noto Serif KR",serif;
  font-size:11.5px;letter-spacing:.12em;color:var(--ink-2);font-weight:700}

.note{
  position:absolute;left:0;right:0;bottom:74px;z-index:13;padding:7px 20px;
  font-size:11px;color:var(--ink-2);background:rgba(239,229,207,.88);
  border-top:1px solid var(--line);backdrop-filter:blur(4px);
}
.note b{color:var(--seal);font-weight:700}

.stage.panel .timeline,.stage.panel .note{right:396px}
.stage.panel .zoomctl{right:412px}
.mapwrap{position:absolute;inset:0 0 106px 0}

@media (max-width:900px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{border-right:0;border-top:1px solid var(--line);order:2;max-height:32vh}
  .stage{order:1}
  .timeline{height:60px}
  .mapwrap,.markers{inset:0 0 92px 0}
  .zoomctl{bottom:106px}
  .stage.panel .timeline,.stage.panel .note,.stage.panel .zoomctl{display:none}
  .detail{
    top:auto;height:62%;width:100%;border-left:0;
    border-top:2px solid var(--ink);border-radius:6px 6px 0 0;
    transform:translateY(101%);
  }
  .detail.open{transform:none}
  .d-top{padding:16px 18px 12px}
  .d-body{padding:14px 18px 24px}
  .brand h1{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .seqpath{animation:none}
}

/* ===================================================================
   Leaflet 연동 — 여기서부터는 지도 엔진 관련 스타일만 다룹니다.
   위쪽 UI 스타일은 그대로 두고, 필요한 것만 덮어씁니다.
   =================================================================== */

/* 4. 타일을 가리던 단색 배경 제거 */
.stage{background:transparent}
.mapwrap{position:absolute;inset:0 0 106px 0;z-index:1}
#map{position:absolute;inset:0;width:100%;height:100%}
.leaflet-container{
  background:#DCE6E8;                /* 타일 로딩 중에만 잠깐 보이는 색 */
  font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  outline:none;
}

/* 떠 있는 UI가 Leaflet 창(zIndex 400~800) 위에 오도록 */
.zoomctl{z-index:1000}
.note,.timeline{z-index:1000}
.detail{z-index:1200}

/* --- 마커: Leaflet divIcon 안에 들어가므로 자체 위치지정을 끈다 --- */
.leaflet-div-icon{background:none;border:0}
.mk{position:relative;left:auto;top:auto;transform:none;width:38px;height:42px;display:block}
.mk.step{position:relative;transform:none;width:26px;height:26px}
.mk .pin{left:4px;top:6px}
.mk .tip{display:none}
.leaflet-marker-icon{transition:opacity .2s}
.leaflet-marker-icon.dim{opacity:.22}
.map-seq .leaflet-marker-icon.evt{opacity:.28}
.map-seq .leaflet-marker-icon.evt:hover{opacity:.8}
.leaflet-marker-icon.sel{z-index:600 !important}
.leaflet-marker-icon.stepicon{z-index:700 !important}

/* 툴팁 — 한지 카드 톤 */
.leaflet-tooltip.mk-tt{
  background:var(--paper-card);color:var(--ink);
  border:1px solid var(--line);border-radius:3px;
  padding:3px 9px;font-size:11.5px;font-weight:500;
  box-shadow:var(--shadow-sm);
}
.leaflet-tooltip.mk-tt::before{border-top-color:var(--line)}

/* 조선 지명 라벨 */
.hlabel{
  font-family:"Noto Serif KR",serif;font-size:11.5px;font-weight:700;
  color:#3B3227;white-space:nowrap;pointer-events:none;
  text-shadow:0 0 3px #FCF9F1,0 0 3px #FCF9F1,0 0 5px #FCF9F1,0 0 5px #FCF9F1;
}
.hlabel i{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:#6A6052;margin-right:4px;vertical-align:2px;
}

/* 사건 전개 경로 */
.journey-line{animation:dash-flow 22s linear infinite}

/* 확대·축소 버튼은 Leaflet 기본 컨트롤을 끄고 기존 UI를 그대로 씁니다 */
.leaflet-control-container .leaflet-top,
.leaflet-control-container .leaflet-bottom{pointer-events:none}

@media (max-width:900px){
  .mapwrap{inset:0 0 92px 0}
}
@media (prefers-reduced-motion:reduce){
  .journey-line{animation:none}
}


/* ===================================================================
   좌측 패널 — 왕별 아코디언
   =================================================================== */
.list{padding:0 0 28px}

.kacc{border-bottom:1px solid var(--line-soft)}
.kacc-head{
  width:100%;display:grid;grid-template-columns:auto 1fr auto auto;
  align-items:center;gap:8px;padding:11px 14px 11px 16px;text-align:left;
  background:var(--paper-card);transition:background .14s;
}
.kacc-head:hover{background:var(--hanji-dark)}
.kacc[data-open="1"] .kacc-head{background:var(--hanji-dark)}
.kacc[data-empty="1"] .kacc-head{opacity:.5}
.kacc-name{
  font-family:"Noto Serif KR",serif;font-size:14px;font-weight:700;color:var(--ink);
  white-space:nowrap;
}
.kacc-name em{font-style:normal;font-size:11px;font-weight:400;color:var(--ink-3);margin-left:4px}
.kacc-yrs{
  font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  justify-self:start;white-space:nowrap;
}
.kacc-cnt{
  min-width:20px;height:18px;padding:0 6px;border-radius:9px;
  background:var(--line-soft);color:var(--ink-2);
  font-size:10.5px;font-weight:700;display:grid;place-items:center;
  font-variant-numeric:tabular-nums;
}
.kacc[data-open="1"] .kacc-cnt{background:var(--seal);color:#FDFAF3}
.kacc[data-empty="1"] .kacc-cnt{background:transparent;color:var(--ink-3)}
.kacc-arrow{
  width:11px;height:11px;color:var(--ink-3);flex:none;
  transition:transform .22s cubic-bezier(.4,0,.2,1);
}
.kacc[data-open="1"] .kacc-arrow{transform:rotate(180deg);color:var(--seal)}

.kacc-body{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .26s cubic-bezier(.4,0,.2,1);
  background:var(--paper-card);
}
.kacc[data-open="1"] .kacc-body{grid-template-rows:1fr}
.kacc-inner{overflow:hidden;min-height:0}
.kacc-empty{padding:12px 16px 14px 40px;font-size:11.5px;color:var(--ink-3)}
.kacc .item{padding:10px 14px 10px 16px;border-left-width:3px}

/* ===================================================================
   전개 단계 뱃지 (캡슐형)
   =================================================================== */
.badge{
  display:inline-flex;align-items:center;gap:4px;vertical-align:2px;
  margin-left:6px;padding:2px 8px 2px 6px;border-radius:999px;
  background:var(--seal);color:#FDFAF3;
  font-size:9.5px;font-weight:700;letter-spacing:.04em;line-height:1.5;
  box-shadow:0 1px 2px rgba(120,40,30,.25);white-space:nowrap;
}
.badge::before{
  content:"";width:5px;height:5px;border-radius:50%;
  background:#FDFAF3;opacity:.85;flex:none;
}
.badge.ghost{
  background:transparent;color:var(--seal);
  border:1px solid currentColor;box-shadow:none;
}
.badge.ghost::before{background:currentColor}

/* ===================================================================
   카테고리 모달 — 드래그 이동
   =================================================================== */
.catmodal{
  position:absolute;z-index:1100;width:320px;
  max-height:min(60%,440px);display:flex;flex-direction:column;
  background:var(--paper-card);border:1px solid var(--line);border-radius:5px;
  box-shadow:0 10px 34px rgba(60,44,20,.30);
  overflow:hidden;
}
.catmodal[hidden]{display:none}
.catmodal.dragging{box-shadow:0 18px 48px rgba(60,44,20,.38);user-select:none}
.cm-head{
  display:flex;align-items:center;gap:8px;flex:none;
  padding:10px 10px 10px 14px;cursor:grab;
  background:var(--hanji-dark);border-bottom:1px solid var(--line);
  touch-action:none;
}
.catmodal.dragging .cm-head{cursor:grabbing}
.cm-grip{
  width:12px;height:12px;flex:none;color:var(--ink-3);
  background:radial-gradient(currentColor 1px,transparent 1.2px) 0 0/4px 4px;
  opacity:.7;
}
.cm-dot{width:9px;height:9px;border-radius:50%;background:var(--cat,var(--seal));flex:none}
.cm-head h3{
  margin:0;font-family:"Noto Serif KR",serif;font-size:14px;font-weight:700;
  color:var(--ink);letter-spacing:.04em;
}
.cm-count{font-size:11px;color:var(--ink-2);margin-left:auto;white-space:nowrap}
.cm-close{
  width:24px;height:24px;flex:none;display:grid;place-items:center;
  border-radius:3px;color:var(--ink-2);
}
.cm-close:hover{background:rgba(176,43,34,.10);color:var(--seal)}
.cm-body{overflow-y:auto;flex:1;scrollbar-width:thin}
.cm-item{
  display:grid;grid-template-columns:auto 1fr;gap:10px;width:100%;text-align:left;
  padding:10px 14px;border-top:1px solid var(--line-soft);
  border-left:3px solid transparent;transition:background .13s;
}
.cm-item:first-child{border-top:0}
.cm-item:hover{background:rgba(176,43,34,.06);border-left-color:var(--seal)}
.cm-item[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--seal)}
.cm-yr{
  font-family:"Noto Serif KR",serif;font-size:11.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;padding-top:1px;min-width:34px;
}
.cm-nm{display:block;font-size:13px;font-weight:500;line-height:1.4;color:var(--ink)}
.cm-item[aria-current="true"] .cm-nm{color:var(--seal)}
.cm-pl{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.cm-foot{
  flex:none;padding:8px 14px;border-top:1px solid var(--line);
  background:var(--hanji-dark);font-size:10.5px;color:var(--ink-3);
}

/* 모달이 열리면 해당 분류 외 마커는 옅게 (좌측 목록은 그대로) */
.map-cat .leaflet-marker-icon.evt{opacity:.3}
.map-cat .leaflet-marker-icon.evt.on{opacity:1}
.map-cat .leaflet-marker-icon.evt:hover{opacity:1}

@media (max-width:900px){
  .catmodal{width:min(88vw,320px);max-height:52%}
}

/* 분류 버튼 — 이제 '필터'가 아니라 '모아보기 열기'이므로 꺼진 상태도 흐리지 않습니다 */
.chip[aria-pressed="false"]{opacity:1}
.chip[aria-pressed="true"]{background:var(--cat);color:#FDFAF3;border-color:var(--cat)}
.chip[aria-pressed="true"] .dot{background:#FDFAF3}
.chip[aria-pressed="true"]:hover{filter:brightness(1.08)}

/* 재난 분류 색 (시트 드롭다운에 있는 분류를 모두 지원) */
:root{ --c-dis:#5C6670; }

/* 연표: 사건이 몰린 구간은 위로 쌓아 모두 보이게 */
.tl-ev{width:12px;height:12px}

/* ===================================================================
   지도 스타일 전환 (타일 제공처)
   =================================================================== */
.basectl{
  position:absolute;top:14px;left:14px;z-index:1000;
  background:var(--paper-card);border:1px solid var(--line);border-radius:4px;
  padding:9px 11px 10px;box-shadow:var(--shadow);
}
.bc-label{
  display:block;font-family:"Noto Serif KR",serif;font-size:11px;font-weight:700;
  letter-spacing:.1em;color:var(--ink-3);margin-bottom:7px;
}
.bc-btns{display:flex;gap:4px}
.bc-btns button{
  padding:5px 11px;border:1px solid var(--line);border-radius:3px;
  background:var(--paper-card);color:var(--ink-2);font-size:11.5px;line-height:1;
  transition:background .14s,color .14s,border-color .14s;
}
.bc-btns button:hover{border-color:var(--ink-2);color:var(--ink)}
.bc-btns button[aria-pressed="true"]{
  background:var(--dancheong);border-color:var(--dancheong);color:#FDFAF3;font-weight:500;
}
.bc-warn{
  margin-top:7px;padding-top:7px;border-top:1px solid var(--line-soft);
  font-size:10.5px;line-height:1.5;color:var(--seal);max-width:190px;
}
@media (max-width:900px){
  .basectl{padding:7px 9px 8px}
  .bc-label{margin-bottom:5px}
  .bc-btns button{padding:4px 8px;font-size:11px}
}

/* 고지도(벡터) 위에 얹는 나라·바다 이름 */
.farlabel{
  position:absolute;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;
  font-family:"Noto Serif KR",serif;
}
.farlabel.land{
  font-size:15px;font-weight:700;letter-spacing:.16em;color:#8A7C64;
  text-shadow:0 0 3px #F2EBD7,0 0 3px #F2EBD7,0 0 6px #F2EBD7;
}
.farlabel.sea{
  font-size:12px;font-weight:400;letter-spacing:.22em;color:#8A7C5A;opacity:.85;
  text-shadow:0 0 3px #D8C9A0,0 0 5px #D8C9A0;
}

/* ===================================================================
   QR·링크 공유 패널 (웹에 올렸을 때만 의미가 있습니다)
   =================================================================== */
.sharebox{
  position:absolute;right:16px;bottom:178px;z-index:1100;width:236px;
  background:var(--paper-card);border:1px solid var(--line);border-radius:5px;
  box-shadow:0 10px 30px rgba(60,44,20,.28);overflow:hidden;
}
.sb-head{
  display:flex;align-items:center;gap:8px;
  padding:9px 8px 9px 13px;background:var(--hanji-dark);
  border-bottom:1px solid var(--line);
}
.sb-head h3{
  margin:0;font-family:"Noto Serif KR",serif;font-size:13px;font-weight:700;
  color:var(--ink);letter-spacing:.04em;
}
.sb-head button{
  margin-left:auto;width:22px;height:22px;display:grid;place-items:center;
  border-radius:3px;color:var(--ink-2);
}
.sb-head button:hover{background:rgba(176,43,34,.10);color:var(--seal)}
.sb-qr{
  display:grid;place-items:center;padding:14px 14px 10px;background:var(--paper-card);
  min-height:40px;
}
.sb-qr canvas,.sb-qr img{display:block;width:168px;height:168px;
  border:1px solid var(--line-soft);background:#fff}
.sb-row{display:flex;gap:5px;padding:0 13px 12px}
.sb-row input{
  flex:1;min-width:0;font:inherit;font-size:11px;padding:5px 7px;
  border:1px solid var(--line);border-radius:3px;
  background:var(--hanji);color:var(--ink-2);
}
.sb-row button{
  flex:none;padding:0 11px;border:1px solid var(--dancheong);border-radius:3px;
  background:var(--dancheong);color:#FDFAF3;font-size:11.5px;
}
.sb-row button:hover{filter:brightness(1.1)}
.sb-note{
  margin:0;padding:0 13px 12px;font-size:10.5px;line-height:1.55;color:var(--ink-3);
}
@media (max-width:900px){
  .sharebox{right:12px;bottom:auto;top:56px;width:min(80vw,236px)}
}

          <span class="cm-grip" aria-hidden="true"></span>

          <span class="cm-count" id="cmCount"></span>
          <button class="cm-close" id="cmClose" aria-label="닫기">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg>
          </button>
        </header>
        <div class="cm-body" id="cmBody"></div>
        <div class="cm-foot">제목 표시줄을 끌어 옮길 수 있습니다</div>
      </section>

      <section class="sharebox" id="sharebox" hidden aria-label="QR·링크 공유">

      <div class="timeline">

  {id:"E038", n:"토지제도 개혁과 과전법", c:"제도", k:"태조(총서)", y:1389, y2:1391, stage:3, d:"1389년 7월", p:"개경", m:"북한 개성특별시", lat:37.9773, lon:126.5497, s:"고려 말 권문세가들의 대농장 독점과 부패를 타파하기 위해, 조준 등 신진사대부가 전제 개혁을 강력히 추진하여 1391년 과전법을 공포했다. 새 왕조의 경제적 기반이 마련된 핵심 사건이다.", r:"태조실록 1권, 총서"},
  {id:"E001", n:"조선 건국", c:"정변", k:"태조", y:1392, stage:3, d:"음 1392-07-17", p:"개경 수창궁", m:"북한 개성특별시", lat:37.97, lon:126.554, s:"이성계가 개경 수창궁에서 왕위에 올라 새 왕조를 열었다. 국호는 이듬해 '조선'으로 정해졌고, 고려 500년 체제가 막을 내렸다.", r:"태조실록 1권, 태조 1년 7월 17일"},
  {id:"E031", n:"선죽교의 피 (정몽주 암살)", c:"정변", k:"태조(총서)", y:1392, d:"1392년 4월", p:"개경 선죽교", m:"북한 개성특별시", lat:37.9736, lon:126.5644, s:"이성계의 다섯째 아들 이방원이 공양왕의 스승이자 고려의 마지막 버팀목이었던 정몽주를 격살하여 새 왕조 개창의 최대 걸림돌을 제거했다.", r:"태조실록 1권, 총서"},
  {id:"E032", n:"왕씨 일가 수장 및 멸족", c:"정변", k:"태조", y:1392, d:"1392년", p:"강화도 앞바다", m:"인천 강화군 해안", lat:37.7, lon:126.5, s:"이성계 일파가 왕씨들에게 섬을 내어준다고 속여 배에 태운 뒤 바다에 수장시켰다. 살아남은 이들은 성을 전(全, 田), 옥(玉) 등으로 바꾸어 숨어 지냈다.", r:"태조실록 1권, 태조 1년"},
  {id:"E033", n:"국호 제정과 한양 천도", c:"외교", k:"태조", y:1392, y2:1394, stage:4, d:"1392년 11월", p:"개경 및 한양", m:"서울 종로구", lat:37.5796, lon:126.977, s:"새 왕조의 기틀을 다지기 위해 명나라에 사신을 보내 '조선'이라는 국호를 확정받았다. 이후 개경을 떠나 새 도읍인 한양으로 천도를 단행하며 조선 시대를 본격적으로 열었다.", r:"태조실록 2권, 3권, 6권"},
  {id:"E039", n:"방석 세자 책봉과 권력 갈등", c:"정변", k:"태조", y:1392, stage:3, d:"1392년 8월", p:"개경", m:"북한 개성특별시", lat:37.9773, lon:126.5497, s:"개국에 결정적 공을 세운 이방원을 배제하고 11세의 막내 방석을 세자로 책봉한 사건이다. 계비 강씨와 정도전의 견제로 이방원이 철저히 소외되며 훗날 왕자의 난을 부르는 불씨가 되었다.", r:"태조실록 1권, 태조 1년 8월"},
  {id:"E002", n:"한양 천도", c:"제도", k:"태조", y:1394, d:"음 1394-10-25", p:"한양", m:"서울특별시 종로구", lat:37.576, lon:126.977, s:"태조가 도읍을 개경에서 한양으로 옮겼다. 이후 경복궁과 종묘·사직이 차례로 세워지며 조선 500년의 수도 골격이 잡혔다.", r:"태조실록 6권, 태조 3년 10월 25일"},
  {id:"E034", n:"조선경국전 편찬과 숭유억불", c:"제도", k:"태조", y:1394, d:"1394년", p:"한양", m:"서울 종로구", lat:37.5796, lon:126.977, s:"정도전이 조선경국전을 편찬하여 새 왕조의 법제를 정비했다. 성균관과 향교를 세워 유학을 진흥하고 사찰을 폐하는 숭유억불 정책으로 국가 기틀을 다졌다.", r:"태조실록 5권, 태조 3년"},
  {id:"E035", n:"제1차 왕자의 난 (무인정사)", c:"정변", k:"태조", y:1398, stage:5, d:"1398년 8월 25일", p:"한양 도성 일대", m:"서울 종로구", lat:37.5796, lon:126.977, s:"신권 중심의 정치를 주창하며 사병 혁파를 시도한 정도전 일파에 맞서, 이방원이 사병을 동원해 정적과 세자 방석 형제를 모두 제거하고 실권을 장악한 참극이다.", r:"태조실록 14권, 태조 7년 8월"},
  {id:"E040", n:"태조 양위와 정종 즉위", c:"정변", k:"정종", y:1398, stage:3, d:"1398년 9월", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"제1차 왕자의 난 직후, 실권을 잃은 태조가 자의 반 타의 반으로 왕위를 내놓았다. 이방원의 철저한 기획 아래 권좌에 뜻이 없던 둘째 아들 방과가 조선 제2대 왕 정종으로 즉위했다.", r:"정종실록 1권, 정종 즉위년"},
  {id:"E043", n:"요동 정벌 추진과 사병 혁파 갈등", c:"외교", k:"태조", y:1398, stage:2, d:"1398년", p:"한양", m:"서울 종로구", lat:37.5796, lon:126.977, s:"정도전 일파가 요동 정벌을 명분으로 내세우며 왕족들의 사병을 혁파하고 병권을 집중시키려 했다. 이는 자신의 세력 기반을 잃을 위기에 처한 이방원이 제1차 왕자의 난을 일으키는 결정적 도화선이 되었다.", r:"태조실록 13권, 태조 7년"},
  {id:"E044", n:"중앙집권 기틀 확립과 태종 즉위", c:"제도", k:"정종", y:1398, y2:1400, stage:4, d:"1398년 9월", p:"개경", m:"북한 개성특별시", lat:37.9773, lon:126.5497, s:"정변 직후 몸을 낮추고 병권(의흥삼군부)만 장악했던 이방원이, 제2차 왕자의 난 이후 세자로 책봉되었다. 이후 의정부와 삼군부를 분리하는 등 강력한 중앙집권을 다진 뒤 조선 제3대 왕으로 등극했다.", r:"정종실록 6권, 정종 2년 11월 13일"},
  {id:"E041", n:"개경 환도와 왕권 강화 개혁", c:"제도", k:"정종", y:1399, y2:1400, stage:3, d:"1399년", p:"개경", m:"북한 개성특별시", lat:37.9773, lon:126.5497, s:"한양의 지형 문제를 이유로 수도를 개경으로 되돌렸다. 실권을 쥔 이방원의 주도로 분경금지법, 사병 혁파, 정무와 군정 분리(의정부/삼군부) 등 강력한 권력 집중 기틀을 마련했다.", r:"정종실록"},
  {id:"E042", n:"집현전 설치 및 민생 정비", c:"문화", k:"정종", y:1399, y2:1400, stage:3, d:"1399년 3월", p:"개경", m:"북한 개성특별시", lat:37.9773, lon:126.5497, s:"정치적 격변 속에서도 집현전 설치, 의서(향약제생집성방) 편찬, 노비변정도감 설치 등 국가 학술 진흥과 민생 안정을 위한 내치가 꾸준히 이루어졌다.", r:"정종실록"},
  {id:"E036", n:"제2차 왕자의 난과 태종 즉위", c:"정변", k:"정종", y:1400, stage:5, d:"1400년 1월", p:"개경", m:"북한 개성특별시", lat:37.9773, lon:126.5497, s:"사병 혁파에 위협을 느낀 넷째 방간이 박포의 거짓 밀고에 속아 난을 일으켰으나 진압되었다. 이 사건으로 반대파를 완전히 숙청한 이방원은 군권을 장악하고 마침내 조선 제3대 왕 태종으로 즉위한다.", r:"정종실록 3권, 6권"},
  {id:"E050", n:"태종의 강력한 억불 정책과 사찰 혁파", c:"제도", k:"태종", y:1400, y2:1406, stage:4, d:"1400년 11월", p:"한양 및 전국 사찰", m:"서울 종로구", lat:37.5796, lon:126.977, s:"성리학을 국가 이념으로 삼은 조선에서, 태종이 태상왕 이성계의 반발을 뚫고 불교 교단을 대대적으로 탄압한 사건이다. 사찰의 토지와 노비를 몰수하고 종단을 축소하여 조선 사회의 유교화를 가속화했다.", r:"태종실록"},
  {id:"E048", n:"육조직계제와 신문고 설치", c:"제도", k:"태종", y:1401, y2:1414, stage:3, d:"1401년 8월", p:"한양", m:"서울 종로구", lat:37.5796, lon:126.977, s:"송나라 제도를 본떠 억울한 백성을 위한 신문고를 설치했다. 또한 1405년부터 육조의 권한을 키우고 1414년 육조직계제를 단행해 강력한 국왕 중심의 중앙집권 체제를 완성했다.", r:"태종실록"},
  {id:"E051", n:"최초의 법정 지폐 '저화' 발행과 실패", c:"경제", k:"태종", y:1401, y2:1403, stage:4, d:"1401년 4월", p:"한양", m:"서울 종로구", lat:37.5796, lon:126.977, s:"상행위 발달을 위해 조선 최초의 명목화폐인 지폐 '저화'를 발행하고 사섬서를 설치했으나, 종이돈에 대한 백성들의 거센 불신으로 인해 1년 5개월 만에 유통이 중단된 경제 정책 실패 사건이다.", r:"태종실록 1권, 태종 1년 4월"},
  {id:"E037", n:"함흥차사와 태조의 최후", c:"사회", k:"태종", y:1402, y2:1408, stage:4, d:"1402년", p:"함흥 및 한양", m:"함경남도 함흥시", lat:39.9186, lon:127.5346, s:"태종에 대한 증오로 함흥에 은거하던 태조는 심부름 온 차사들을 죽였다는 '함흥차사' 일화를 남겼다. 환궁 후 불도에 정진하다 향년 74세로 승하했다.", r:"태종실록 3권, 태종 2년"},
  {id:"E045", n:"조사의의 난과 부자의 전면전", c:"정변", k:"태종", y:1402, stage:6, d:"1402년 11월 5일", p:"함경도 안변 ~ 평안도 안주", m:"북한 강원도 안변 ~ 평안남도 안주", lat:39.0333, lon:127.5333, s:"신덕왕후의 척족 조사의가 태조의 배후 지원을 받아 일으킨 반란이다. 관군 선봉대를 꺾으며 기세를 올렸으나, 태종이 파견한 4만 대군에 의해 청천강에서 대패했다. 이로 인해 이방원을 몰아내려던 태조의 의지는 완전히 꺾이게 된다.", r:"태종실록 4권, 태종 2년"},
  {id:"E047", n:"한양 재천도", c:"제도", k:"태종", y:1405, stage:2, d:"1405년 9월", p:"개경 및 한양", m:"서울 종로구", lat:37.5796, lon:126.977, s:"골육상잔의 참변을 뒤로하고 개경으로 돌아갔던 조선 조정이, 태종의 강력한 의지에 따라 1405년 다시 한양으로 천도하며 500년 도읍의 기틀을 다졌다.", r:"태종실록 10권, 태종 5년"},
  {id:"E046", n:"외척 민씨 4형제의 숙청", c:"정변", k:"태종", y:1406, y2:1416, stage:5, d:"1406년 8월 18일", p:"한양 및 제주도", m:"서울 종로구", lat:37.5796, lon:126.977, s:"외척의 권력 비대를 경계한 태종이 선위파동을 이용해 원경왕후의 남동생 민무구 형제를 탄핵한 사건이다. 10년에 걸쳐 네 처남 모두에게 자진 명령을 내리며 외척 세력을 철저히 멸문시켰다.", r:"태종실록 12권 ~ 31권"},
  {id:"E049", n:"거북선 등장과 민생·국방 개혁", c:"문화", k:"태종", y:1413, stage:3, d:"1413년 2월", p:"한양 및 임진강", m:"경기 파주시 임진나루", lat:37.892, lon:126.745, s:"호패법을 실시하고 의녀를 선발하는 등 민생을 챙겼다. 특히 임진강에서 왜구 격퇴용 장갑선인 '거북선'의 해전 훈련을 참관하며 국방력을 강력히 다졌다.", r:"태종실록 25권, 태종 13년 2월"},
  {id:"E052", n:"선위파동과 세종대왕 즉위", c:"정변", k:"태종", y:1418, y2:1418, stage:4, d:"1418년 6월", p:"한양 도성", m:"서울 종로구", lat:37.5796, lon:126.977, s:"태종이 4차례의 선위파동을 통해 신하들을 시험하고 왕권을 굳건히 한 사건이다. 결국 자질이 부족한 양녕대군을 폐위하고 셋째 충녕대군(세종)에게 왕위를 물려주며, 상왕으로서 새 왕의 방패막이를 자처했다.", r:"태종실록 35권, 36권"},
  {id:"E053", n:"제4대 왕 즉위와 집현전 육성", c:"문화", k:"세종", y:1418, stage:3, d:"1418년 8월", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"태종의 양위를 받아 즉위한 세종이 집현전을 통해 젊고 유망한 학자들을 전폭적으로 지원한 사건이다. 이들을 바탕으로 훈민정음, 과학, 농업 등 조선 문화의 찬란한 황금기를 열었다.", r:"세종실록"},
  {id:"E004", n:"대마도 정벌(기해동정)", c:"전란", k:"세종", y:1419, stage:4, d:"음 1419-06-19", p:"대마도", m:"일본 쓰시마섬", lat:34.4, lon:129.33, s:"삼군도체찰사 이종무가 병선 227척과 1만 7천 군사를 이끌고 왜구의 소굴 대마도를 원정했다. 왜선 129척을 격파하고 근거지를 소탕한 뒤 평화협정을 맺었으며, 왜구의 위협을 근절하고 평화 시대의 기틀을 확립했다.", r:"세종실록 4권, 세종 1년 6월 19일", url:"https://sillok.history.go.kr/id/kda_10106019_001", ok:true},
  {id:"E058", n:"박연의 악제 개혁과 궁중음악 정비", c:"문화", k:"세종", y:1424, y2:1447, stage:4, d:"1424년", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"박연을 등용하여 좌방(아악)과 우방(향악·당악)으로 흩어져 있던 음악 체계를 집대성하고 아악기와 악보를 정비했다. 수입에 의존하던 편경과 편종의 국산화에 성공했으며, 향악과 아악을 조화시켜 보태평·정대업 등 자주적 궁중음악의 기틀을 확립했다.", r:"세종실록 36권, 세종"},
  {id:"E059", n:"《농사직설》 편찬과 농업 기술 발전", c:"경제", k:"세종", y:1429, y2:1444, stage:4, d:"1429년", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"정초와 집현전 학자들이 우리 풍토에 맞는 최초의 실용 농서인 《농사직설》을 편찬했다. 각 지역의 수리·기상·지세 조건을 상세히 수록하여 곡식 재배 효율을 높였으며, 《칠정산》 편찬 등과 맞물려 세종 시대 경제적 안정의 기틀을 확립했다.", r:"세종실록 44권, 세종 11년 5월 16일", url:"https://sillok.history.go.kr/id/kda_11105016_001", ok:true},
  {id:"E055", n:"세종 시대의 천문학과 과학 혁명", c:"문화", k:"세종", y:1432, y2:1438, stage:4, d:"1432년", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"장영실 등 천재적 기술진을 등용하여 혼천의, 해시계, 자격루 등을 발명하고 대규모 천문 관측대인 간의대를 설치한 사건이다. 조선의 과학기술이 세계 최고 수준의 혁명적인 발전을 이루었다.", r:"세종실록"},
  {id:"E054", n:"의정부서사제와 포용의 정치", c:"제도", k:"세종", y:1436, stage:3, d:"1436년", p:"한양 도성", m:"서울 종로구", lat:37.5796, lon:126.977, s:"세종 18년을 기점으로, 태종의 강력한 '육조직계제'를 정승들과 논의하는 '의정부서사제'로 변혁했다. 권력을 분산시키고 언론의 비판을 수용하는 유연하고 포용적인 정치를 펼쳤다.", r:"세종실록 72권, 세종 18년"},
  {id:"E057", n:"훈민정음 창제를 위한 비밀 빌드업", c:"문화", k:"세종", y:1436, y2:1440, stage:4, d:"1436년", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"세종이 훈민정음 창제라는 비밀 프로젝트에 몰두하기 위해, 의정부서사제 도입과 세자 대리청정으로 시간을 확보하고 한·중·일의 음운서를 수집하며 치밀하게 준비한 과정이다.", r:"세종실록"},
  {id:"E056", n:"훈민정음 창제와 반포", c:"문화", k:"세종", y:1443, y2:1446, stage:4, d:"1443년 12월", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"한자와 학문을 독점하여 권력을 유지하려는 사대부들의 반발을 피해, 세종대왕이 홀로 극비리에 새 문자를 창제하고 반포한 역사적 사건이다. 백성을 향한 애민 정신과 문화적 자주성의 극치이다.", r:"세종실록 102권, 113권"},
  {id:"E060", n:"문종 즉위와 문치·군정 정비", c:"제도", k:"문종", y:1450, y2:1452, stage:4, d:"음 1450-02-23", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"8년간의 세자 섭정을 마친 문종이 즉위하여 언로를 대폭 확장하고 6품 이상 신하들의 윤대를 허용하며 유교적 소통 정치를 펼쳤다. 세종 말기의 왕실 불교 경향을 바로잡는 한편, 《고려사》, 《고려사절요》, 《동국병감》 등을 편찬하여 국가 역사와 자주적 병법 체계를 확립했다.", r:"문종실록 1권, 문종 즉위년 2월 23일", url:"https://sillok.history.go.kr/id/kfa_10002023_001", ok:true},
  {id:"E061", n:"단종 즉위와 황표정사", c:"제도", k:"단종", y:1452, y2:1453, stage:4, d:"음 1452-05-18", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"문종 승하 후 12세의 단종이 즉위했으나, 왕실 최고 어른이 없어 수렴청정조차 받지 못했다. 김종서, 황보인 등 고명대신들이 인사 대상자 명단에 황색 점을 찍어 올리면 왕이 그대로 낙점하는 '황표정사'를 실시하며 정권을 독점했고, 이는 훗날 계유정난의 직접적인 도화선이 되었다.", r:"단종실록 1권, 단종 즉위년 5월 18일", url:"https://sillok.history.go.kr/id/kga_10005018_001", ok:true},
  {id:"E006", n:"계유정난", c:"정변", k:"단종", y:1453, stage:8, d:"음 1453-10-10", p:"한양 경복궁", m:"서울특별시 종로구", lat:37.5796, lon:126.977, s:"안평대군과 손잡은 고명대신들의 권력 독점에 맞서, 수양대군이 권람·한명회·신숙주와 무사들을 결집해 정변을 일으켰다. 김종서와 황보인 등 대신들을 살생부에 따라 참살하고 안평대군을 사사했으며, 스스로 영의정부사 겸 판이병조사에 올라 왕권과 신권을 모두 장악했다.", r:"단종실록 8권, 단종 1년 10월 10일", url:"https://sillok.history.go.kr/id/kga_10110010_001", ok:true},
  {id:"E062", n:"이징옥의 난", c:"정변", k:"단종", y:1453, y2:1453, stage:3, d:"음 1453-10-19", p:"함길도 종성", m:"북한 함경북도 온성군·종성군 일대", lat:42.956, lon:129.832, s:"계유정난으로 김종서가 피살되자, 함길도도절제사 이징옥이 신임 절제사 박호문을 베고 수양대군 토벌을 내걸며 거병했다. 그러나 종성부사 정종과 호군 이행검 등의 기습으로 피살되며 난은 조기에 진압되었다.", r:"단종실록 9권, 단종 1년 10월 20일", url:"https://sillok.history.go.kr/id/kga_10110020_001", ok:true},
  {id:"E065", n:"세조의 집권과 왕권 강화 개혁", c:"제도", k:"세조", y:1455, y2:1468, stage:7, d:"1455년 윤6월", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"단종 복위 세력을 제거한 세조는 의정부서사제를 폐지하고 육조직계제를 단행하여 강력한 전제 왕권을 구축했다. 집현전과 경연을 폐지하고 승정원을 강화했으며, 조선의 영구 법전인 《경국대전》 편찬 착수, 토지제도를 직전제로 개혁, 군제와 관제를 대폭 정비하여 국가 통치 제도의 기틀을 완성했다.", r:"세조실록 1권, 세조 즉위년 윤6월 / 세조실록 40권, 세조 12년 8월", url:"https://sillok.history.go.kr/id/kha_10107001_001", ok:true},
  {id:"E066", n:"세조의 무단·측근 정치와 원상제 도입", c:"제도", k:"세조", y:1455, y2:1468, stage:4, d:"1455년", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"즉위의 대의명분 부재를 물리적 힘으로 극복하고자 세조는 정난공신(한명회·권람)과 집현전 학사 출신(신숙주·정인지)을 축으로 삼아 강력한 무단·측근 정치를 펼쳤다. 모든 정무를 직접 장악하기 위해 승정원의 권한을 극대화했으며, 말년인 1468년에는 원로 중신들이 승정원에서 세자와 국정을 상의·결정하는 '원상제(院相制)'를 창안했다.", r:"세조실록 47권, 세조 14년 7월 16일", url:"https://sillok.history.go.kr/id/kha_11407016_001", ok:true},
  {id:"E063", n:"사육신의 단종 복위 운동", c:"정변", k:"세조", y:1456, y2:1456, stage:4, d:"음 1456-06-01", p:"한양 창덕궁 및 군기감", m:"서울 종로구·중구", lat:37.5794, lon:126.991, s:"성삼문, 박팽년 등 집현전 학사 출신 문관들과 무신 유응부가 명나라 사신 연회 때 세조를 제거하고 상왕 단종을 복위시키려 했다. 한명회의 조치로 별운검이 폐지되며 거사가 미뤄졌고, 김질의 밀고로 주모자들이 체포되어 군기감 앞에서 처형당했다.", r:"세조실록 4권, 세조 2년 6월 2일", url:"https://sillok.history.go.kr/id/kha_10206002_001", ok:true},
  {id:"E064", n:"금성대군의 순흥 단종 복위 운동", c:"정변", k:"세조", y:1457, y2:1457, stage:4, d:"1457년", p:"경상도 순흥 및 강원도 영월", m:"경북 영주시 순흥면 / 강원 영월군", lat:36.9248, lon:128.5772, s:"사육신 사건 후 영월로 유배된 단종을 복위시키기 위해, 순흥에 유배 중이던 세종의 6남 금성대군이 부사 이보흠과 함께 의병 거사를 꾀했다. 그러나 거사 직전 관노의 고발로 발각되어 금성대군과 이보흠이 처형당하고 단종도 결국 영월에서 사사되었다.", r:"세조실록 9권, 세조 3년 9월 2일", url:"https://sillok.history.go.kr/id/kha_10309002_001", ok:true},
  {id:"E075", n:"관찬 통사 《동국통감》 편찬 완성", c:"문화", k:"성종", y:1458, y2:1485, stage:5, d:"1458년", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"세조 대 시작된 우리 역사 편찬 사업이 신숙주·노사신의 《삼국사절요》(1476년)를 거쳐 서거정 등에 의해 1485년 총 56권의 편년체 통사 《동국통감》으로 최종 완성되었다. 단군조선부터 고려 말까지를 '외기-삼국기-신라기-고려기'로 체계화하고 성종과 신진 사림의 성리학적 명분론과 자주적 역사의식을 집대성했다.", r:"성종실록 181권, 성종 16년 7월 26일", url:"https://sillok.history.go.kr/id/kja_11607026_001", ok:true},
  {id:"E073", n:"《경국대전》 완성 및 반포", c:"제도", k:"성종", y:1460, y2:1485, stage:7, d:"1460년 7월", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"세조 대 육전상정소 설치로 시작된 통일 법전 편찬이 25년간의 각고의 수정 끝에 1485년(성종 16년) 《을사대전》으로 최종 완성되어 반포되었다. 《신묘대전》과 《갑오대전》의 미비점을 전면 보완하여 다시는 고치지 않는 영세불변의 '만세성전(萬世成典)'으로 확정되었으며, 조선 500년 유교 법치주의의 영구한 기틀이 되었다.", r:"성종실록 175권, 성종 16년 1월 1일", url:"https://sillok.history.go.kr/id/kja_11601001_001", ok:true},
  {id:"E007", n:"이시애의 난", c:"정변", k:"세조", y:1467, d:"음 1467-05-16", p:"함길도 길주", m:"북한 함경북도 길주군", lat:40.96, lon:129.33, s:"함길도 토호 이시애가 중앙에서 내려온 수령 임명에 반발해 군사를 일으켰다. 진압 후 북방 통치 방식이 크게 개편되었다.", r:"세조실록 42권, 세조 13년 5월 16일"},
  {id:"E067", n:"예종 즉위와 최초의 수렴청정·남이의 옥사", c:"제도", k:"예종", y:1468, y2:1469, stage:5, d:"음 1468-09-07", p:"한양 수강궁 및 창덕궁", m:"서울 종로구", lat:37.5788, lon:126.9948, s:"19세의 예종이 즉위했으나 건강 악화로 인해 모후 정희왕후가 조선 최초의 수렴청정을 실시하고, 한명회·신숙주 등 원상(院相)들이 승정원에서 국정을 협치했다. 재위 중 유자광의 고변으로 남이의 옥사가 일어나 신진 무신들이 숙청되었으며, 삼포 왜인 개별 무역 금지와 둔전 농민 경작 허용 등 민생 안정책을 폈다.", r:"예종실록 1권, 예종 즉위년 9월 7일 / 10월 24일", url:"https://sillok.history.go.kr/id/kia_10009007_001", ok:true},
  {id:"E068", n:"남이의 옥사 (남이·강순의 옥)", c:"정변", k:"예종", y:1468, y2:1468, stage:6, d:"음 1468-10-24", p:"한양 창덕궁 및 군기감 앞", m:"서울 종로구·중구", lat:37.567, lon:126.979, s:"한명회·신숙주 등 훈구 원상 세력과 예종의 견제로 병조판서에서 밀려난 청년 명장 남이가 혜성 출현 시 남긴 탄식을 빌미로 유자광의 모함을 받았다. 남이와 영의정 강순 등 신진 무인 30여 명이 군기감 앞에서 능지처참되고 가솔이 노비로 전락하는 대대적 숙청이 단행되었다.", r:"예종실록 1권, 예종 즉위년 10월 24일 / 10월 27일", url:"https://sillok.history.go.kr/id/kia_10010024_002", ok:true},
  {id:"E069", n:"성종 즉위와 정희왕후 수렴청정", c:"제도", k:"성종", y:1469, y2:1476, stage:5, d:"음 1469-11-28", p:"한양 경복궁 및 창덕궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"예종 사후 정희왕후와 최고 권력자 한명회의 정치적 결탁으로 13세의 자을산군(성종)이 당일 전격 즉위했다. 정희왕후의 7년 수렴청정기 동안 호패법 폐지, 《경국대전》 교정 완성, 숭유억불 및 유교 윤리 강화, 내수사 고리대 축소와 잠업·면작 장려 등 국가 제도와 민생 경제를 굳건히 다졌다.", r:"성종실록"},
  {id:"E070", n:"성종 친정과 사림 등용·도학정치", c:"제도", k:"성종", y:1476, y2:1494, stage:5, d:"음 1476-01-13", p:"한양 경복궁 및 성균관", m:"서울 종로구", lat:37.5796, lon:126.977, s:"정희왕후의 수렴청정이 끝나자 성종은 원상제를 폐지하여 왕명 출납과 서무 결재권을 완전히 회복했다. 김종직 등 영남 사림파를 대거 등용해 훈구 대신을 견제하고 세력 균형을 이루었으며, 홍문관 확충과 존경각 건립, 독서당 설치 등 도학정치에 기반한 유교 르네상스를 꽃피웠다.", r:"성종실록 63권, 성종 7년 1월 13일", url:"https://sillok.history.go.kr/id/kja_10701013_001", ok:true},
  {id:"E076", n:"역대 시문 총서 《동문선》 편찬", c:"문화", k:"성종", y:1478, y2:1478, stage:4, d:"음 1478-11-12", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"성종의 명으로 서거정·노사신·강희맹·양성지 등 23인의 문형들이 삼국시대부터 조선 초까지의 대표 시문을 집대성하여 총 133권 45책의 《동문선》을 편찬했다. 중국의 《문선》을 뛰어넘는 55종의 방대한 문체로 민족 문학의 정수를 총망라하였으며, 대내외에 독자적이고 자주적인 문학관을 확립했다.", r:"성종실록 98권, 성종 9년 11월 12일", url:"https://sillok.history.go.kr/id/kja_10911012_001", ok:true},
  {id:"E071", n:"폐비 윤씨 폐출과 사사", c:"정변", k:"성종", y:1479, y2:1482, stage:5, d:"음 1479-06-02", p:"한양 창경궁 및 윤씨 사저", m:"서울 종로구", lat:37.5796, lon:126.977, s:"성종의 총애를 받아 왕비에 오른 윤씨(연산군의 생모)가 투기와 비상(극약) 은닉, 용안에 상처를 낸 사건으로 폐출되었다. 이후 동정을 살피러 간 궁인들의 허위 보고로 1482년 사약을 받고 사사되었으며, 훗날 연산군의 피바람 나는 복수극(갑자사화)을 부른 비극적 화근이 되었다.", r:"성종실록 105권, 성종 10년 6월 2일 / 성종실록 144권, 성종 13년 8월 16일", url:"https://sillok.history.go.kr/id/kja_11308016_001", ok:true},
  {id:"E072", n:"훈구·사림의 대립과 유향소 부활", c:"제도", k:"성종", y:1480, y2:1488, stage:4, d:"1480년대", p:"한양 및 전국 군현", m:"서울 종로구 / 전국 군현", lat:37.5796, lon:126.977, s:"성종이 훈구 척신을 견제하고자 김종직 문하의 사림파를 삼사에 대거 발탁하면서 양대 세력 간의 극한 대립이 시작되었다. 사림파는 유자광·이극돈 등의 비리를 맹공격하며 세력을 확장했고, 세조 대에 폐지되었던 지방 자치 기구인 유향소를 부활시켜 향촌 사회의 기강을 바로잡고 사림 정치의 확고한 기반을 다졌다.", r:"성종실록 221권, 성종 19년 10월 22일", url:"https://sillok.history.go.kr/id/kja_11910022_001", ok:true},
  {id:"E074", n:"《동국여지승람》 편찬과 문화 집대성", c:"문화", k:"성종", y:1481, y2:1530, stage:5, d:"1481년", p:"한양 경복궁", m:"서울 종로구", lat:37.5796, lon:126.977, s:"성종은 도학정치 이념을 확립하고 민족 문화를 집대성하기 위해 《동국여지승람》, 《동문선》, 《동국통감》, 《악학궤범》 등 방대한 국가 관찬 서적을 편찬했다. 특히 1481년 완성된 《동국여지승람》(50권)은 지리와 시문·인물을 결합한 종합 지리지로, 김종직의 1차 수교를 거쳐 1530년 《신증동국여지승람》(55권)으로 계승되었다.", r:"성종실록 132권, 성종 12년 / 중종실록 68권, 중종 25년", url:"https://sillok.history.go.kr/id/kja_11208000_001", ok:true},
  {id:"E008", n:"삼포왜란", c:"전란", k:"중종", y:1510, d:"음 1510-04-04", p:"제포·부산포·염포", m:"경남 창원시 진해구", lat:35.13, lon:128.68, s:"삼포에 거주하던 왜인들이 통제 강화에 반발해 봉기했다. 진압 뒤 삼포가 폐쇄되며 조선과 일본의 교역이 급격히 위축되었다.", r:"중종실록 11권, 중종 5년 4월 4일"},
  {id:"E009", n:"임진왜란 발발 (부산진 전투)", c:"전란", k:"선조", y:1592, y2:1598, stage:8, d:"음 1592-04-13", p:"부산진", m:"부산광역시 동구", lat:35.131, lon:129.04, s:"일본군이 부산진에 상륙하며 7년 전쟁이 시작됐다. 첨사 정발이 전사하고 성이 함락되었으며, 전선은 20일 만에 한양까지 밀려 올라갔다.", r:"선조실록 26권, 선조 25년 4월 13일"},
  {id:"E010", n:"한산도 대첩", c:"전란", k:"선조", y:1592, d:"음 1592-07-08", p:"한산도 앞바다", m:"경남 통영시 한산면", lat:34.79, lon:128.48, s:"이순신이 학익진으로 일본 수군 주력을 격파했다. 남해 제해권이 조선으로 넘어오며 일본의 수륙병진 전략이 무너졌다.", r:"선조실록 29권, 선조 25년 7월"},
  {id:"E011", n:"명량 대첩", c:"전란", k:"선조", y:1597, d:"음 1597-09-16", p:"울돌목", m:"전남 진도군·해남군 사이", lat:34.57, lon:126.306, s:"13척으로 일본 함대를 울돌목의 급류에서 막아냈다. 정유재란의 전세를 되돌린 전투로 꼽힌다.", r:"선조실록 94권, 선조 30년 9월"},
  {id:"E012", n:"인조반정", c:"정변", k:"광해군", y:1623, d:"음 1623-03-12", p:"한양 창덕궁", m:"서울특별시 종로구", lat:37.5794, lon:126.991, s:"서인 세력이 광해군을 몰아내고 인조를 세웠다. 중립외교가 폐기되고 친명배금으로 돌아서며 뒤이은 호란의 배경이 되었다.", r:"광해군일기 187권, 광해 15년 3월 12일"},
  {id:"E013", n:"병자호란 · 남한산성 농성", c:"전란", k:"인조", y:1636, y2:1637, d:"음 1636-12-14", p:"남한산성", m:"경기도 광주시", lat:37.479, lon:127.181, s:"청군의 침입으로 인조가 남한산성에 들어가 47일간 버텼다. 이듬해 삼전도에서 항복하며 조선은 청과 군신관계를 맺었다.", r:"인조실록 33권, 인조 14년 12월 14일"},
  {id:"E014", n:"이인좌의 난", c:"정변", k:"영조", y:1728, d:"음 1728-03-15", p:"청주성", m:"충북 청주시", lat:36.64, lon:127.49, s:"영조의 즉위 정통성을 문제 삼은 소론 강경파가 청주성을 함락하며 봉기했다. 진압 후 탕평책이 본격화되었다.", r:"영조실록 16권, 영조 4년 3월 15일"},
  {id:"E015", n:"규장각 설치", c:"제도", k:"정조", y:1776, d:"음 1776-09-25", p:"창덕궁 주합루", m:"서울특별시 종로구", lat:37.582, lon:126.991, s:"정조가 즉위 직후 왕실 도서관 겸 학술·정책 기관으로 규장각을 세웠다. 서얼 출신 검서관 등용 등 개혁 인재의 산실이 되었다.", r:"정조실록 2권, 정조 즉위년 9월 25일"},
  {id:"E016", n:"홍경래의 난", c:"사회", k:"순조", y:1811, y2:1812, d:"음 1811-12-18", p:"평안도 가산·정주성", m:"북한 평안북도 정주시", lat:39.68, lon:125.22, s:"평안도 차별과 삼정 문란에 맞서 홍경래가 봉기해 정주성에서 넉 달을 버텼다. 19세기 민란의 서막이 된 사건이다.", r:"순조실록 14권, 순조 11년 12월 18일"},
  {id:"E017", n:"임술 농민봉기", c:"사회", k:"철종", y:1862, d:"음 1862-02-18", p:"진주", m:"경남 진주시", lat:35.18, lon:128.108, s:"진주에서 시작된 항쟁이 70여 개 고을로 번졌다. 삼정이정청이 설치됐으나 근본 개혁에는 이르지 못했다.", r:"철종실록 14권, 철종 13년 2월 18일"},
  {id:"E018", n:"병인양요", c:"외교", k:"고종", y:1866, d:"음 1866-09-06", p:"강화도", m:"인천광역시 강화군", lat:37.747, lon:126.488, s:"프랑스 함대가 강화도를 점령했다가 정족산성 등에서 패해 물러났다. 외규장각 도서가 이때 약탈되었다.", r:"고종실록 3권, 고종 3년 9월"},
  {id:"E019", n:"신미양요", c:"외교", k:"고종", y:1871, d:"음 1871-04-24", p:"강화 광성보", m:"인천광역시 강화군", lat:37.679, lon:126.523, s:"미국 함대가 강화 해협에 진입해 광성보를 함락했다. 어재연 부대가 전멸했고, 조선은 척화비를 세우며 통상 거부를 굳혔다.", r:"고종실록 8권, 고종 8년 4월"},
  {id:"E020", n:"동학농민운동 (고부 봉기)", c:"사회", k:"고종", y:1894, y2:1895, d:"음 1894-01-10", p:"고부관아", m:"전북 정읍시 고부면", lat:35.603, lon:126.85, s:"군수 조병갑의 수탈에 맞서 전봉준이 농민들을 이끌고 관아를 점거했다. 이후 전국적 항쟁과 청일전쟁으로 이어졌다.", r:"고종실록 31권, 고종 31년"},
];

  "E001": [

    {t:"조선 제3대 왕 태종 즉위", d:"1400년 11월", pl:"개경", lat:37.9773, lon:126.5497, x:"고려 정치 문화의 잔재를 걷어내고 강력한 왕권 안정책을 마련한 이방원은 1400년 11월, 마침내 정종의 양위를 받아 제3대 왕으로 등극했다.", r:"정종실록 6권, 정종 2년 11월 13일"},

  "E045": [

    {t:"진압군 선봉의 궤멸", d:"1402년 11월", pl:"안변 부근", lat:39.0333, lon:127.5333, x:"태종이 보낸 이천우의 진압군 선봉대가 조사의의 군대에 포위되어 기마 유격대를 모두 잃고 대패했다. 반란군은 순식간에 1만 명으로 불어났다.", r:"태종실록 4권, 태종 2년 11월"},

    {t:"청천강 전투 대패", d:"1402년 11월 27일", pl:"청천강 유역", lat:39.695, lon:125.583, x:"태종의 막강한 대군 출정에 반란군 진영은 흔들렸고, 결국 청천강 근처 전투에서 관군에게 대패하며 조사의와 주모자들이 모두 체포되었다.", r:"태종실록 4권, 태종 2년 11월 27일"},
    {t:"한양 압송과 참형", d:"1402년 12월 18일", pl:"한양 도성", lat:37.5796, lon:126.977, x:"체포된 주모자들은 도성으로 압송되어 순위부에 갇혔고 모두 참형을 당했다. 반면 태종은 유배지에 있던 형 방간의 안전은 약속하며 사태를 마무리했다.", r:"태종실록 4권, 태종 2년 12월 18일"},

  "E046": [

    {t:"민무구·무질 자진", d:"1410년", pl:"제주도", lat:33.5097, lon:126.5219, x:"세자의 장인과 종친들, 심지어 세자마저 형제들을 죽여야 한다고 상소하자, 1410년 태종은 마침내 제주도에 있던 두 형제에게 자진 명령을 내려 목숨을 거두었다.", r:"태종실록 19권, 태종 10년"},
    {t:"두 아우의 자진과 외척 멸문", d:"1416년", pl:"한양 도성", lat:37.5796, lon:126.977, x:"6년 뒤, 태종은 살아남은 남동생 무휼과 무회에게도 자진하도록 조치하고 처자를 변방으로 내쫓아버렸다. 네 처남의 목숨을 앗아간 뒤에야 피의 숙청이 종결되었다.", r:"태종실록 31권, 태종 16년"},
  ],
  "E047": [
    {t:"개경 환도의 한계", d:"1399년", pl:"개경", lat:37.9773, lon:126.5497, x:"제1차 왕자의 난 직후 정종 때 한양을 버리고 개경으로 돌아갔으나, 구세력의 잔재가 남은 개경은 새 왕조의 중심지가 되기에 한계가 있었다.", r:"정종실록"},
    {t:"한양 재천도 단행", d:"1405년 9월", pl:"한양 도성", lat:37.5796, lon:126.977, x:"태조의 뜻을 잇고자 했던 태종은 신하들의 이견을 뚫고 한양 재천도를 전격 단행했다. 비로소 한양은 500년 조선의 흔들림 없는 정치·문화 중심지가 되었다.", r:"태종실록 10권, 태종 5년 9월"},

  "E049": [

  ],
  "E050": [
    {t:"신진사대부의 척불과 태조의 한계", d:"1400년 이전", pl:"한양 도성", lat:37.5796, lon:126.977, x:"성리학으로 무장한 사대부들은 고려 멸망의 원인으로 부패한 불교를 지목했다. 하지만 개국의 절대 권력자인 태조 이성계가 독실한 불교 신자였기에 억불 정책은 한계에 부딪혀 있었다.", r:"태조실록"},
    {t:"태종의 탄압과 태상왕의 진노", d:"1400년 ~ 1402년", pl:"한양 도성", lat:37.5796, lon:126.977, x:"1400년 즉위한 태종은 대궐의 불상을 내쫓고 불교 행사를 금지시켰다. 사찰 토지를 몰수하려 했으나, 노발대발한 태상왕 이성계의 강력한 반발에 부딪혀 일시적으로 뜻을 꺾어야만 했다.", r:"태종실록 3권, 태종 2년 4월"},
    {t:"토지 몰수와 승려들의 신문고 시위", d:"1405년 ~ 1406년 2월", pl:"한양 궁궐 앞", lat:37.5796, lon:126.977, x:"결국 태종은 대신들의 건의를 명분 삼아 전국 사찰의 토지와 노비를 몰수했다. 존폐 위기에 몰린 승려 수백 명이 대궐 앞 신문고를 치며 호소했으나 철저히 묵살당했다.", r:"태종실록 11권, 태종 6년 2월"},
    {t:"종단 축소와 억불 체제의 완성", d:"1406년 3월 이후", pl:"전국", lat:37.5796, lon:126.977, x:"태종은 한술 더 떠 남겨둘 사찰의 수를 엄격히 제한하고 종단마저 대폭 축소시켜 버렸다. 이 기조는 세종 대에 36본산 체제(선교 양종)로 굳어지며 조선의 완벽한 억불 체제로 완성되었다.", r:"태종실록 11권, 태종 6년 3월"},

  "E051": [
    {t:"태조 대의 화폐개혁 유보", d:"1394년 7월", pl:"한양 도성", lat:37.5796, lon:126.977, x:"쌀이나 베 같은 물품화폐 중심의 경제에서 벗어나고자 화폐개혁 건의가 있었으나, 태조는 아직 사회 여건이 성숙하지 않아 혼란이 올 것을 우려해 이를 유보했다.", r:"태조실록 6권, 태조 3년 7월"},
    {t:"하륜의 건의와 사섬서 설치", d:"1401년 4월", pl:"한양 도성", lat:37.5796, lon:126.977, x:"태종 1년, 좌의정 하륜이 상행위 발달을 위해 지폐인 '저화' 유통을 건의했다. 태종이 이를 수용하여 전담 관청인 사섬서를 설치하고 조선 최초의 법정 지폐를 찍어냈다.", r:"태종실록 1권, 태종 1년 4월"},
    {t:"백성들의 불신과 저화 기피", d:"1401년 ~ 1403년", pl:"전국", lat:37.5796, lon:126.977, x:"저화 1장의 가치를 쌀 2말, 포 1필로 정하여 유통을 강제했으나, 백성들은 종이 쪼가리의 가치를 전혀 신뢰하지 않아 조정의 금지 조치에도 꿋꿋이 물품화폐를 고수했다.", r:"태종실록"},
    {t:"포화 허용 및 사섬서 폐지", d:"1403년 9월", pl:"한양 도성", lat:37.5796, lon:126.977, x:"상거래가 꽉 막히자 조정은 별수 없이 포(베)의 사용을 다시 허용했다. 결국 저화는 완전히 자취를 감추고 인쇄를 맡던 사섬서도 1년 5개월 만에 폐지되는 굴욕을 맞았다.", r:"태종실록 6권, 태종 3년 9월"},

  "E052": [

    {t:"제8대 예종 즉위와 수강궁 어극", d:"음 1468-09-07", pl:"한양 수강궁 (창경궁 터)", lat:37.5788, lon:126.9948, x:"세조의 병세가 위독해지자 19세의 세자가 수강궁에서 양위를 받아 조선 제8대 국왕으로 즉위했다.", r:"예종실록 1권, 예종 즉위년 9월 7일"},
    {t:"조선 최초의 수렴청정과 원상제 협치", d:"1468년 9월", pl:"한양 수강궁 승정원", lat:37.5788, lon:126.9948, x:"어린 왕의 병약함과 미숙함을 보완하기 위해 모후 정희왕후가 조선 왕조 최초로 수렴청정을 선언했고, 신숙주·한명회·구치관 등 원상들이 승정원에 출근해 모든 국정 서무를 의결하는 협치 체제가 가동되었다.", r:"예종실록 1권, 예종 즉위년 9월 8일"},
    {t:"유자광의 고변과 남이의 옥사", d:"음 1468-10-24 ~ 10-27", pl:"한양 군기감 앞길", lat:37.567, lon:126.979, x:"유자광의 모략과 고변으로 혜성 출현 시 지은 백두산 시(詩)를 빌미 삼아, 병조판서를 지낸 청년 명장 남이와 영의정 강순, 조경치, 변영수 등이 역모 혐의로 몰려 군기감 앞에서 처형당했다.", r:"예종실록 1권, 예종 즉위년 10월 24일"},
    {t:"삼포 대일 무역 통제와 둔전 농민 경작", d:"1469년 6월", pl:"한양 및 경상도 삼포", lat:35.13, lon:128.68, x:"짧은 치세 속에서도 삼포에서 왜인들과의 개별 사무역을 금지하여 국가 통제를 강화하고, 각 도의 둔전을 일반 농민들이 경작할 수 있도록 허용하여 농촌 경제 안정을 도모했다.", r:"예종실록 6권, 예종 1년 6월 25일"},

  "E068": [

    {t:"혜성 출현과 남이의 탄식", d:"1468년 10월", pl:"한양 도성 (남이 사저)", lat:37.57, lon:126.98, x:"병조판서에서 밀려난 남이가 밤하늘에 나타난 혜성을 보고 \"묵은 것을 몰아내고 새로운 것을 받아들일 징조\"라고 말한 것이 정적들에게 빌미를 제공하는 결정적 화근이 되었다.", r:"예종실록 1권, 예종 즉위년 10월 24일"},
    {t:"유자광의 엿듣기와 역모 고변", d:"음 1468-10-24", pl:"한양 창덕궁", lat:37.5794, lon:126.991, x:"서얼 출신 무관이자 남이를 질투하던 병조참지 유자광이 이 말을 엿듣고, \"남이가 신왕조 출현을 도모하며 왕이 창덕궁으로 이어할 때 거사하려 한다\"고 예종에게 허위 고변했다.", r:"예종실록 1권, 예종 즉위년 10월 24일"},
    {t:"의금부 투옥과 조작된 문초", d:"음 1468-10-25 ~ 10-26", pl:"한양 의금부", lat:37.572, lon:126.983, x:"남이와 영의정 강순 등이 즉시 의금부로 압송되어 혹독한 문초를 받았다. 유자광의 증언과 증인들의 거짓 진술이 더해지며 훈구파의 기획 아래 반역 혐의가 확정되었다.", r:"예종실록 1권, 예종 즉위년 10월 25일"},
    {t:"군기감 앞 능지처참과 신진 무신 숙청", d:"음 1468-10-27", pl:"한양 군기감 앞길", lat:37.567, lon:126.979, x:"남이, 강순, 조경치, 변영수, 문효량 등 무인 관료와 측근 30여 명이 군기감 앞에서 능지처참되었다. 가솔들은 노비로 전락하고 공신 녹권이 몰수되며 신진 무인 세력은 완전히 궤멸되었다.", r:"예종실록 1권, 예종 즉위년 10월 27일"},

  "E069": [
    {t:"예종의 급서와 자을산군의 전격 당일 즉위", d:"음 1469-11-28", pl:"한양 경복궁", lat:37.5796, lon:126.977, x:"예종이 승하하자 정희왕후는 원자 제안군과 장손 월산군을 제치고, 사위 한명회의 강력한 후원을 받는 13세의 자을산군(의경세자 2남)을 당일 즉각 조선 제9대 왕으로 책봉했다.", r:"성종실록 1권, 성종 즉위년 11월 28일"},
    {t:"정희왕후의 수렴청정과 호패법 폐지", d:"1469년 12월", pl:"한양 경복궁", lat:37.5796, lon:126.977, x:"정희왕후가 수렴청정을 개시한 직후, 백성에 대한 관의 과도한 통제를 완화하고 민심을 수습하기 위해 세조 대 복원되었던 호패법을 전격 폐지했다.", r:"성종실록 1권, 성종 즉위년 12월 19일"},

    {t:"숭유억불과 성리학적 사회 윤리 확립", d:"1471년 ~ 1473년", pl:"한양 도성", lat:37.5796, lon:126.977, x:"화장 풍습 금지, 도성 내 염불소 폐지, 승려 출입 및 사대부 부녀자의 비구니 출가 금지 등 억불 정책을 단행하고, 외종 6촌 이내 혼인 금지와 전국 교생 삼강행실 강습을 의무화했다.", r:"성종실록 18권, 성종 3년 6월 15일"},
    {t:"내수사 장리 축소와 의류·농잠업 진흥", d:"1472년 ~ 1475년", pl:"전국 각 도", lat:36.5, lon:127.8, x:"왕실 내수사의 고리대 기구인 장리소를 절반 이하(560→235개)로 축소하여 농민 수탈을 막고, 각 도 잠실 설치와 평안·황해도의 목화밭 조성, 남방의 뽕나무 재배로 의류업을 진흥시켰다.", r:"성종실록 25권, 성종 3년 12월 8일"},

  "E070": [
    {t:"수렴청정 철렴과 원상제 폐지", d:"음 1476-01-13", pl:"한양 경복궁", lat:37.5796, lon:126.977, x:"성종이 20세 성년이 되자 정희왕후가 7년간의 수렴청정을 거두었다. 성종은 즉시 훈구 원로들이 정무를 대리하던 원상제를 전격 폐지하고 국왕 직할 친정 체제를 열었다.", r:"성종실록 63권, 성종 7년 1월 13일"},
    {t:"김종직 등 사림파 등용과 훈구 견제", d:"1476년 ~ 1478년", pl:"한양 도성", lat:37.5796, lon:126.977, x:"성종은 정몽주·길재의 학맥을 잇는 영남의 신진 사림 김종직 등을 대간에 발탁하여 기성 훈구파를 비판하게 하고, 1478년 참판 이하 문무신 교차 임명으로 권력 독점을 차단했다.", r:"성종실록 90권, 성종 9년 3월 10일"},
    {t:"공신 척족 세력의 숙청 (임사홍·유자광)", d:"1478년 4월", pl:"한양 경복궁", lat:37.5796, lon:126.977, x:"훈구 공신 세력의 핵심인 임사홍과 유자광 등이 사림 대간의 격렬한 탄핵을 받아 유배되면서, 신진 사림 세력이 중앙 정계의 주요 축으로 부상했다.", r:"성종실록 91권, 성종 9년 4월 28일"},
    {t:"홍문관 확충과 사가독서제(독서당) 운영", d:"1478년 ~ 1480년", pl:"한양 및 용산 두모포", lat:37.54, lon:127.015, x:"세조 때 폐지된 집현전을 계승하여 홍문관을 경연과 학술의 중추로 대폭 확충하고, 용산 두모포에 독서당을 지어 젊고 유능한 문신들에게 휴가를 주어 연구에 전념하게 했다.", r:"성종실록 92권, 성종 9년 5월 19일"},
    {t:"관학 진흥과 도학정치의 완성", d:"1484년 ~ 1489년", pl:"한양 성균관", lat:37.5866, lon:126.9976, x:"성균관에 도서관인 존경각을 짓고 양현고를 후원하는 한편, 성균관과 향교에 학전과 서적을 나누어 주어 관학을 진흥시키며 성리학적 이상 국가인 도학정치를 완성했다.", r:"성종실록 164권, 성종 15년 3월 24일"},

  "E071": [

    {t:"비상(극약) 은닉 발각과 갈등 표출", d:"1477년 3월", pl:"한양 궁궐", lat:37.5796, lon:126.977, x:"윤씨의 방에서 비상과 곶감에 얽힌 독약 살포 정황이 발각되어 빈으로 강등될 뻔했으나, 성종의 관대한 처분으로 무마되며 왕실 내 불신의 골이 깊어졌다.", r:"성종실록 78권, 성종 8년 3월 29일"},
    {t:"용안 손상 사건과 전격 폐서인", d:"음 1479-06-02", pl:"한양 창경궁", lat:37.5788, lon:126.9948, x:"성종의 규방 출입을 질투하던 윤씨가 격렬한 부부싸움 중 왕의 얼굴에 손톱자국을 내자, 모후 인수대비와 성종의 격분으로 중전의 자리에서 폐출되어 친정으로 쫓겨났다.", r:"성종실록 105권, 성종 10년 6월 2일"},
    {t:"내시들의 허위 보고와 사약 하사", d:"음 1482-08-16", pl:"한양 폐비 윤씨 사저", lat:37.575, lon:126.985, x:"세자의 앞날을 걱정한 성종이 동정을 살피러 궁인을 보냈으나, 인수대비의 뜻을 받든 나인들이 \"반성의 기미가 없다\"고 허위 보고하자 조정 회의를 거쳐 사약을 내려 사사했다.", r:"성종실록 144권, 성종 13년 8월 16일"},
    {t:"'윤씨지묘' 묘비와 비극의 씨앗", d:"1482년 8월 이후", pl:"경기도 고양 회묘", lat:37.658, lon:126.832, x:"묘비조차 세우지 못하게 하려 했으나 세자의 모친임을 감안해 '윤씨지묘'로만 표기했다. 이 사건은 훗날 즉위한 연산군이 피의 숙청을 자행하는 직접적인 도화선이 되었다.", r:"성종실록 144권, 성종 13년 8월 21일"},

  "E072": [

    {t:"유향소 제도의 부활과 향촌 자치 확립", d:"음 1488-10-22", pl:"전국 각 도 군현", lat:36.5, lon:127.8, x:"세조 때 이시애의 난으로 폐지되었던 지방 자치 기구인 유향소(留鄕所)를 마침내 복설하여, 부패한 수령과 향리를 규찰하고 향풍을 쇄신하며 사림의 지방 정치 기반을 확고히 다졌다.", r:"성종실록 221권, 성종 19년 10월 22일"},

/* 전개 단계 뱃지에 쓸 숫자.
   EVENTS 안에 stage 값을 넣어두면 그대로 쓰고, 없으면 STEPS 길이에서 가져옵니다. */
function stageOf(ev){
  if (typeof ev.stage === 'number') return ev.stage;
  return STEPS[ev.id] ? STEPS[ev.id].length : 0;
}
function badgeHTML(ev, ghost){
  const n = stageOf(ev);
  return n ? `<span class="badge${ghost ? ' ghost' : ''}">전개 ${n}단계</span>` : '';
}

const farLayer = L.layerGroup();
FAR.forEach(p => L.marker([p.lat, p.lon], {
  interactive:false, keyboard:false,
  icon: L.divIcon({ className:'far-host',
    html:`<span class="farlabel ${p.t}">${p.n}</span>`, iconSize:[0,0], iconAnchor:[0,0] }),
}).addTo(farLayer));

function isVector(){ return !!(BASEMAPS[baseIdx] && BASEMAPS[baseIdx].vector); }
function syncFarLabels(){
  const show = isVector() && map.getZoom() <= 7.5;
  if (show){ if (!map.hasLayer(farLayer)) farLayer.addTo(map); }
  else if (map.hasLayer(farLayer)) map.removeLayer(farLayer);
}
map.on('zoomend', syncFarLabels);

let baseLayer = null, baseIdx = -1, tileErrs = 0, errTimer = null;
const attribEl = document.getElementById('attrib');
const bcBtns   = document.getElementById('bcBtns');

function setBasemap(i){
  if (i === baseIdx || !BASEMAPS[i]) return;
  const b = BASEMAPS[i];
  if (baseLayer){ map.removeLayer(baseLayer); baseLayer = null; }

  if (b.vector){
    if (!map.hasLayer(geoLayer)) geoLayer.addTo(map);
    if (geoLayer.bringToBack) geoLayer.bringToBack();
    mapEl.style.background = SEA;
  } else {
    if (map.hasLayer(geoLayer)) map.removeLayer(geoLayer);
    mapEl.style.background = '';
    const opt = { maxZoom: b.max, crossOrigin: true, attribution: b.attr };
    if (b.sub) opt.subdomains = b.sub;
    baseLayer = L.tileLayer(b.url, opt).addTo(map);
    if (baseLayer.setZIndex) baseLayer.setZIndex(1);
  }
  baseIdx = i; tileErrs = 0;
  attribEl.innerHTML = b.attr;
  if (bcBtns) bcBtns.querySelectorAll('button').forEach((x, j) =>
    x.setAttribute('aria-pressed', j === i ? 'true' : 'false'));
  syncFarLabels();
  if (!b.vector) watchTiles();
}

/* 타일이 연달아 실패하면 다음 제공처로 넘어간다 */
function watchTiles(){
  if (!baseLayer || !baseLayer.on) return;
  baseLayer.on('tileerror', () => {
    tileErrs++;
    if (tileErrs < 6) return;
    if (errTimer) return;
    errTimer = setTimeout(() => {
      errTimer = null;
      showBaseWarn(`'${BASEMAPS[baseIdx].name}' 지도를 불러오지 못해 '고지도'로 되돌렸습니다.`);
      setBasemap(0);
    }, 600);
  });
}
function showBaseWarn(msg){
  const host = document.querySelector('.basectl');
  if (!host) return;
  let w = document.querySelector('.bc-warn');
  if (!w){ w = document.createElement('div'); w.className = 'bc-warn';
           host.appendChild(w); }
  w.textContent = msg;
}

BASEMAPS.forEach((b, i) => {
  const x = document.createElement('button');
  x.type = 'button'; x.textContent = b.name;
  x.setAttribute('aria-pressed', 'false');

function padOpts(){
  const wide = innerWidth > 900;
  const open = detail.classList.contains('open');
  return {
    paddingTopLeft:     L.point(wide ? 40 : 20, 30),
    paddingBottomRight: L.point(wide && open ? 420 : 40, wide ? 40 : 30),
    duration: 0.9,

function goToBounds(b){

/* ---------------------------------------------------------------- 마커 */
let sel = null;          // 선택된 사건 id
let openCat = null;      // 모달로 열린 분류
let openKing = null;     // 펼쳐진 왕
let stepIdx = -1, playing = null;
const mkEls = new Map();
const stepMarkers = [];
let seqLine = null;

function pinIcon(catVar){
  return L.divIcon({
    className: 'evt',
    html: `<span class="mk" style="--cat:var(${catVar})"><span class="pin"></span></span>`,
    iconSize: [38, 42], iconAnchor: [19, 42],
  });
}
function stepIcon(n){
  return L.divIcon({
    className: 'stepicon',
    html: `<span class="mk step"><span class="num">${n}</span></span>`,
    iconSize: [26, 26], iconAnchor: [13, 13],
  });
}

EVENTS.forEach(ev => {
  const m = L.marker([ev.lat, ev.lon], { icon: pinIcon(CATS[ev.c].v), riseOnHover: true, title: ev.n });
  m.bindTooltip(`${ev.y}　${ev.n}`, { direction:'top', offset:[0,-40], className:'mk-tt', opacity:1 });
  m.on('click', () => select(ev.id));
  m.addTo(map);
  mkEls.set(ev.id, m);
});

/* 한양·개경처럼 좌표가 똑같은 사건이 여러 건이면 마커가 완전히 포개져
   맨 위 한 개만 눌립니다. 화면 픽셀 기준으로 살짝 벌려 모두 누를 수 있게 하고,
   확대할수록 실제 위치로 모이도록 배율에 맞춰 다시 계산합니다. */
const COLOC = (() => {
  const g = new Map(), off = new Map();
  EVENTS.forEach(ev => {
    const key = ev.lat.toFixed(4) + ',' + ev.lon.toFixed(4);
    if (!g.has(key)) g.set(key, []);
    g.get(key).push(ev.id);
  });
  g.forEach(ids => {
    if (ids.length < 2) return;
    const r = 16 + ids.length * 2.2;
    ids.forEach((id, i) => {
      const a = (2 * Math.PI * i) / ids.length - Math.PI / 2;
      off.set(id, [Math.cos(a) * r, Math.sin(a) * r * 0.85]);
    });
  });
  return off;
})();

function spreadMarkers(){
  if (!COLOC.size || !map.project) return;
  const z = map.getZoom();
  EVENTS.forEach(ev => {
    const o = COLOC.get(ev.id), m = mkEls.get(ev.id);
    if (!o || !m) return;
    const base = map.project([ev.lat, ev.lon], z);
    m.setLatLng(map.unproject(L.point(base.x + o[0], base.y + o[1]), z));
  });
}
map.on('zoomend', spreadMarkers);

function refreshMarkerState(){
  EVENTS.forEach(ev => {
    const m = mkEls.get(ev.id); const el = m && m.getElement(); if (!el) return;
    el.classList.toggle('on',  !!openCat && ev.c === openCat);
    el.classList.toggle('sel', sel === ev.id);
    const inner = el.querySelector('.mk');
    if (inner) inner.dataset.sel = sel === ev.id ? '1' : '0';
  });
}

/* =====================================================================
   좌측 패널 — 왕별 아코디언 (분류 선택과 무관하게 항상 전체가 보입니다)
   ===================================================================== */
const listEl = document.getElementById('list');

function renderList(){
  listEl.innerHTML = '';
  KINGS.forEach(k => {
    const evs = EVENTS.filter(e => e.k === k.n);
    const box = document.createElement('div');
    box.className = 'kacc';
    box.dataset.king = k.n;
    box.dataset.open = openKing === k.n ? '1' : '0';
    if (!evs.length) box.dataset.empty = '1';

    const head = document.createElement('button');
    head.type = 'button'; head.className = 'kacc-head';
    head.setAttribute('aria-expanded', openKing === k.n ? 'true' : 'false');
    head.innerHTML =
      `<span class="kacc-name">${k.disp || k.n}<em>${k.h}</em></span>` +
      `<span class="kacc-yrs">${k.a}–${k.b}</span>` +
      `<span class="kacc-cnt">${evs.length}</span>` +
      `<svg class="kacc-arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>`;
    head.onclick = () => toggleKing(k.n);

    const body = document.createElement('div');
    body.className = 'kacc-body';
    const inner = document.createElement('div');
    inner.className = 'kacc-inner';

    if (!evs.length){
      inner.innerHTML = `<div class="kacc-empty">아직 정리된 사건이 없습니다.</div>`;
    } else {
      evs.forEach(ev => {
        const b = document.createElement('button');
        b.className = 'item'; b.type = 'button'; b.dataset.id = ev.id;
        b.style.setProperty('--cat', `var(${CATS[ev.c].v})`);
        b.setAttribute('aria-current', sel === ev.id ? 'true' : 'false');
        b.innerHTML = `<span class="rule"></span><span>
          <span class="yr mono">${ev.y}${ev.y2 ? '–' + ev.y2 : ''}</span>
          <span class="nm">${ev.n}${badgeHTML(ev)}</span>
          <span class="pl">${ev.p}</span></span>`;
        b.onclick = () => select(ev.id);
        inner.appendChild(b);
      });
    }
    body.appendChild(inner);
    box.appendChild(head); box.appendChild(body);
    listEl.appendChild(box);
  });
  document.getElementById('count').textContent = `${KINGS.length}대 · 사건 ${EVENTS.length}건`;
  refreshMarkerState();
}

function toggleKing(name){
  openKing = (openKing === name) ? null : name;   // 다른 왕을 열면 기존 것은 닫힙니다
  listEl.querySelectorAll('.kacc').forEach(el => {
    const on = el.dataset.king === openKing;
    el.dataset.open = on ? '1' : '0';
    el.querySelector('.kacc-head').setAttribute('aria-expanded', on ? 'true' : 'false');
  });
}

function revealEvent(id){
  const ev = EVENTS.find(e => e.id === id); if (!ev) return;
  if (openKing !== ev.k) toggleKing(ev.k);
  setTimeout(() => {
    listEl.querySelector(`[data-id="${id}"]`)
          ?.scrollIntoView({ block:'nearest', behavior: reduce ? 'auto' : 'smooth' });
  }, 260);
}

   우측 상단 분류 버튼 → 드래그 가능한 모달

/* 처음 열릴 때 위치 — 지도 가운데에서 살짝 오른쪽 위 */
function placeModal(){
  const s = stage.getBoundingClientRect();
  const w = modal.offsetWidth || 320;
  const left = detail.classList.contains('open') && innerWidth > 900
    ? Math.max(20, s.width - 420 - w - 24)
    : Math.max(20, s.width / 2 - w / 2 + 40);
  modal.style.left = Math.round(left) + 'px';
  modal.style.top  = '24px';
}

/* --- 드래그 이동 --- */
(function makeDraggable(){
  let dx = 0, dy = 0, on = false;
  cmHead.addEventListener('pointerdown', e => {
    if (e.target.closest('.cm-close')) return;
    const r = modal.getBoundingClientRect(), s = stage.getBoundingClientRect();
    dx = e.clientX - r.left; dy = e.clientY - r.top;
    on = true; modal.classList.add('dragging');
    cmHead.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  cmHead.addEventListener('pointermove', e => {
    if (!on) return;
    const s = stage.getBoundingClientRect();
    const w = modal.offsetWidth, h = modal.offsetHeight;
    let x = e.clientX - s.left - dx;
    let y = e.clientY - s.top  - dy;
    x = Math.min(Math.max(8, x), Math.max(8, s.width  - w - 8));
    y = Math.min(Math.max(8, y), Math.max(8, s.height - h - 8));
    modal.style.left = Math.round(x) + 'px';
    modal.style.top  = Math.round(y) + 'px';
  });
  ['pointerup','pointercancel'].forEach(t =>
    cmHead.addEventListener(t, () => { on = false; modal.classList.remove('dragging'); }));
})();

/* ---------------------------------------------------------------- 연표 */
const tl = document.getElementById('tl');
const TL0 = ERA.from - 20, TL1 = ERA.to + 8;
function renderTimeline(){
  tl.querySelectorAll('.tl-ev,.tl-tick,.tl-year').forEach(n => n.remove());
  for (let y = Math.ceil(TL0 / 50) * 50; y <= TL1; y += 50){
    const l = (y - TL0) / (TL1 - TL0) * 100;
    const t = document.createElement('div'); t.className = 'tl-tick'; t.style.left = l + '%'; tl.appendChild(t);
    const s = document.createElement('div'); s.className = 'tl-year mono'; s.style.left = l + '%';
    s.textContent = y; tl.appendChild(s);
  }
  const W = tl.clientWidth || 900, placed = [];
  EVENTS.forEach(ev => {
    const b = document.createElement('button');
    b.className = 'tl-ev'; b.type = 'button';
    const x = (ev.y - TL0) / (TL1 - TL0) * W;
    let row = 0;
    while (row < 3 && placed.some(p => p.row === row && Math.abs(p.x - x) < 13)) row++;
    placed.push({ x, row });
    b.style.top = (44 - row * 12) + 'px';
    b.style.left = ((ev.y - TL0) / (TL1 - TL0) * 100) + '%';
    b.style.setProperty('--cat', `var(${CATS[ev.c].v})`);
    b.title = `${ev.y} ${ev.n}`; b.setAttribute('aria-label', `${ev.y}년 ${ev.n}`);
    b.dataset.sel = sel === ev.id ? '1' : '0';
    b.onclick = () => select(ev.id);
    tl.appendChild(b);
  });
}

/* ------------------------------------------------------------ 상세 패널 */

  stepMarkers.forEach(o => map.removeLayer(o.m));
  stepMarkers.length = 0;
  if (seqLine){ map.removeLayer(seqLine); seqLine = null; }
  stepIdx = -1;
  mapEl.classList.remove('map-seq');

function syncSelection(){
  listEl.querySelectorAll('.item').forEach(b =>
    b.setAttribute('aria-current', b.dataset.id === sel ? 'true' : 'false'));
  cmBody.querySelectorAll('.cm-item').forEach(b =>
    b.setAttribute('aria-current', b.dataset.id === sel ? 'true' : 'false'));
  renderTimeline();
  refreshMarkerState();
}

function select(id){
  const ev = EVENTS.find(e => e.id === id); if (!ev) return;
  clearSteps(); sel = id;
  syncSelection(); revealEvent(id);
  renderDetail(ev);

  stage.classList.add('panel');

  if (st){
    buildSteps(st);
    goToBounds(L.latLngBounds(st.map(s => [s.lat, s.lon])).pad(0.15));

    const z = Math.max(map.getZoom(), 9);
    if (reduce) map.setView([ev.lat, ev.lon], z);
    else map.flyTo([ev.lat, ev.lon], z, { duration: 0.9 });
  }
}

/* --------------------------------------------------------- 사건 전개 재생 */
function buildSteps(st){
  mapEl.classList.add('map-seq');
  seqLine = L.polyline([], {
    color: getComputedStyle(document.documentElement).getPropertyValue('--seal').trim() || '#B02B22',
    weight: 2.6, opacity: .9, dashArray: '2 8', lineCap: 'round', className: 'journey-line',
  }).addTo(map);
  st.forEach((s, i) => {
    const m = L.marker([s.lat, s.lon], { icon: stepIcon(i + 1), riseOnHover: true });
    m.bindTooltip(`${i + 1}. ${s.t}`, { direction:'top', offset:[0,-16], className:'mk-tt', opacity:1 });
    m.on('click', () => goStep(i));
    stepMarkers.push({ m, s, shown:false });
  });
  goStep(0, true);
}

function goStep(i, first){
  const st = STEPS[sel]; if (!st) return;
  i = Math.max(0, Math.min(st.length - 1, i)); stepIdx = i;
  seqLine.setLatLngs(st.slice(0, i + 1).map(s => [s.lat, s.lon]));

  stepMarkers.forEach((o, j) => {
    const show = j <= i;
    if (show && !o.shown){
      o.m.addTo(map); o.shown = true;
      const el = o.m.getElement();
      if (el){ const inner = el.querySelector('.mk');
        if (inner){ inner.classList.add('drop'); setTimeout(() => inner.classList.remove('drop'), 400); } }
    }
    if (!show && o.shown){ map.removeLayer(o.m); o.shown = false; }
    const el = o.m.getElement();
    if (el){ const inner = el.querySelector('.mk');
      if (inner){ inner.dataset.past = j < i ? '1' : '0'; inner.dataset.cur = j === i ? '1' : '0'; } }
  });

  detail.querySelectorAll('.steps li').forEach((li, j) => {
    li.setAttribute('aria-current', j === i ? 'true' : 'false');
    if (j === i) li.scrollIntoView({ block:'nearest', behavior: reduce ? 'auto' : 'smooth' });
  });
  const prev = document.getElementById('sprev'), next = document.getElementById('snext');
  if (prev) prev.disabled = i === 0;
  if (next) next.disabled = i === st.length - 1;

  if (!first){
    const ll = L.latLng(st[i].lat, st[i].lon);
    if (!map.getBounds().pad(-0.22).contains(ll)) map.panTo(ll, { duration: 0.6 });
  }
}

function togglePlay(){
  const btn = document.getElementById('splay'), st = STEPS[sel];
  if (playing){ clearTimeout(playing); playing = null; btn.textContent = '재생'; return; }
  btn.textContent = '정지';
  if (stepIdx >= st.length - 1) goStep(0);
  const tick = () => {
    if (stepIdx >= st.length - 1){ playing = null; btn.textContent = '재생'; return; }
    goStep(stepIdx + 1); playing = setTimeout(tick, 2200);
  };
  playing = setTimeout(tick, 1200);
}

/* ------------------------------------------------------------------ 시작 */
map.fitBounds(KOREA_BOUNDS, { paddingTopLeft: L.point(40,30), paddingBottomRight: L.point(40,40) });
syncPlaceLabels();
syncFarLabels();
spreadMarkers();
openKing = (KINGS.find(k => EVENTS.some(e => e.k === k.n)) || KINGS[0]).n;
document.querySelector('.brand .era').textContent = `${ERA.from} — ${ERA.to}`;
renderList();
renderTimeline();
syncChips();
new ResizeObserver(() => map.invalidateSize({ pan:false })).observe(stage);
addEventListener('resize', () => { if (!modal.hidden) placeModal(); });

/* 세 가지 모두 실패하면 네트워크 문제일 가능성이 큽니다 */
/* '고지도'는 파일 안의 데이터로 그리므로 실패할 일이 없습니다. */

/* =====================================================================
   QR·링크 공유
   ===================================================================== */
(function () {
  const box   = document.getElementById('sharebox');
  const qrBox = document.getElementById('sbQr');
  const urlEl = document.getElementById('sbUrl');
  const note  = document.getElementById('sbNote');
  const btn   = document.getElementById('zshare');
  if (!box || !btn) return;

  let drawn = false;
  const pageUrl = () => location.href.split('#')[0];

  function draw() {
    const web = location.protocol === 'https:' || location.protocol === 'http:';
    urlEl.value = web ? pageUrl() : '아직 웹에 올리지 않았습니다';
    if (!web) {
      note.textContent = '이 파일을 웹 주소로 열면 여기에 QR 코드가 나타납니다. '
                       + '지금은 컴퓨터에 저장된 파일로 보고 계십니다.';
      return;
    }
    note.textContent = '휴대폰 카메라로 QR을 비추면 바로 열립니다.';
    if (drawn) return;
    if (typeof QRCode === 'undefined') {
      note.textContent = 'QR 코드를 그리지 못했습니다. 아래 주소를 복사해 공유해 주세요.';
      return;
    }
    try {
      new QRCode(qrBox, {
        text: pageUrl(), width: 168, height: 168,
        colorDark: '#332C25', colorLight: '#FFFFFF',
        correctLevel: QRCode.CorrectLevel.M,
      });
      drawn = true;
    } catch (e) {
      note.textContent = 'QR 코드를 그리지 못했습니다. 아래 주소를 복사해 공유해 주세요.';
    }
  }

  btn.onclick = () => {
    const open = !box.hidden;
    box.hidden = open;
    btn.setAttribute('aria-expanded', open ? 'false' : 'true');
    if (!open) draw();
  };
  document.getElementById('sbClose').onclick = () => {
    box.hidden = true; btn.setAttribute('aria-expanded', 'false');
  };
  document.getElementById('sbCopy').onclick = async () => {
    const b = document.getElementById('sbCopy');
    try {
      await navigator.clipboard.writeText(urlEl.value);
      b.textContent = '복사됨';
    } catch (e) {
      urlEl.focus(); urlEl.select();
      b.textContent = '선택됨';
    }
    setTimeout(() => { b.textContent = '복사'; }, 1600);
  };
})();

</script>
